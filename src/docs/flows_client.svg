<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22C55E"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#EF4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1F2937">VUPTH Client — Fluxos de Navegacao</text>

  <!-- ==================== FLUXO PRINCIPAL ==================== -->
  <text x="400" y="85" text-anchor="middle" font-size="14" font-weight="600" fill="#6B7280">FLUXO PRINCIPAL</text>

  <!-- Home -->
  <rect x="300" y="100" width="200" height="80" rx="12" fill="#22C55E" stroke="#16A34A" stroke-width="2"/>
  <text x="400" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="white">Home</text>
  <text x="400" y="155" text-anchor="middle" font-size="11" fill="white" opacity="0.9">Busca + Filtro + Banner fila</text>

  <!-- Arrow Home → EstablishmentDetail -->
  <line x1="400" y1="180" x2="400" y2="220" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="205" font-size="10" fill="#6B7280">toca card</text>

  <!-- EstablishmentDetail -->
  <rect x="300" y="225" width="200" height="80" rx="12" fill="#FFFFFF" stroke="#22C55E" stroke-width="2"/>
  <text x="400" y="258" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">Detalhe</text>
  <text x="400" y="278" text-anchor="middle" font-size="11" fill="#6B7280">Profissionais + Entrar na fila</text>

  <!-- Arrow Detail → Auth check -->
  <line x1="400" y1="305" x2="400" y2="345" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="330" font-size="10" fill="#6B7280">entrar na fila</text>

  <!-- Auth Decision -->
  <polygon points="400,350 460,385 400,420 340,385" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="400" y="390" text-anchor="middle" font-size="11" font-weight="600" fill="#92400E">Logado?</text>

  <!-- Arrow Auth → Login (No) -->
  <line x1="340" y1="385" x2="200" y2="385" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="270" y="378" font-size="10" fill="#EF4444">nao</text>

  <!-- Arrow Auth → QueueStatus (Yes) -->
  <line x1="400" y1="420" x2="400" y2="470" stroke="#22C55E" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="415" y="450" font-size="10" fill="#22C55E">sim</text>

  <!-- QueueStatus -->
  <rect x="300" y="475" width="200" height="100" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="400" y="510" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">QueueStatus</text>
  <text x="400" y="530" text-anchor="middle" font-size="11" fill="#6B7280">Posicao + Countdown</text>
  <text x="400" y="548" text-anchor="middle" font-size="10" fill="#F59E0B">Amarelo >10min | Vermelho ≤10min</text>

  <!-- Arrow QueueStatus → Home -->
  <path d="M 500 525 Q 570 525 570 300 Q 570 140 500 140" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="580" y="330" font-size="10" fill="#6B7280" transform="rotate(90, 580, 330)">voltar ao inicio</text>

  <!-- Arrow QueueStatus Cancel -->
  <line x1="300" y1="545" x2="220" y2="545" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="225" y="560" font-size="10" fill="#EF4444">cancelar → Home</text>

  <!-- ==================== FLUXO AUTH ==================== -->
  <text x="120" y="285" text-anchor="middle" font-size="14" font-weight="600" fill="#6B7280">AUTH</text>

  <!-- Login -->
  <rect x="50" y="350" width="160" height="70" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  <text x="130" y="380" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">Login</text>
  <text x="130" y="400" text-anchor="middle" font-size="10" fill="#6B7280">Email + Senha + Toggle</text>

  <!-- Arrow Login → Home -->
  <path d="M 130 350 Q 130 300 Q 130 200 300 150" fill="none" stroke="#22C55E" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="170" y="250" font-size="10" fill="#22C55E">sucesso</text>

  <!-- SignUp -->
  <rect x="50" y="460" width="160" height="80" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  <text x="130" y="490" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">SignUp</text>
  <text x="130" y="508" text-anchor="middle" font-size="10" fill="#6B7280">Email + Senha + Confirmar</text>
  <text x="130" y="523" text-anchor="middle" font-size="10" fill="#6B7280">Regras visuais + Toggle</text>

  <!-- Arrow SignUp ↔ Login -->
  <line x1="130" y1="420" x2="130" y2="460" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="140" y="445" font-size="10" fill="#6B7280">ja cadastrado?</text>

  <!-- Arrow Home → SignUp -->
  <path d="M 300 160 Q 200 160 130 200 Q 100 220 100 300 Q 100 440 100 460" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="85" y="350" font-size="10" fill="#6B7280">cadastrar</text>

  <!-- ==================== FLUXO PERFIL ==================== -->
  <text x="900" y="85" text-anchor="middle" font-size="14" font-weight="600" fill="#6B7280">PERFIL (logado)</text>

  <!-- Profile -->
  <rect x="800" y="100" width="200" height="70" rx="12" fill="#FFFFFF" stroke="#22C55E" stroke-width="2"/>
  <text x="900" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">Profile</text>
  <text x="900" y="150" text-anchor="middle" font-size="10" fill="#6B7280">Atendimentos | Config | Sair</text>

  <!-- Arrow Home → Profile -->
  <line x1="500" y1="130" x2="800" y2="130" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrow-green)"/>
  <text x="650" y="122" font-size="10" fill="#22C55E">icone perfil</text>

  <!-- Attendances -->
  <rect x="750" y="210" width="180" height="80" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="840" y="240" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">Atendimentos</text>
  <text x="840" y="258" text-anchor="middle" font-size="10" fill="#6B7280">Em andamento</text>
  <text x="840" y="273" text-anchor="middle" font-size="10" fill="#6B7280">Realizados (futuro)</text>

  <!-- Settings -->
  <rect x="950" y="210" width="180" height="80" rx="12" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text x="1040" y="240" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">Configuracoes</text>
  <text x="1040" y="258" text-anchor="middle" font-size="10" fill="#6B7280">Nome | Email | Senha</text>
  <text x="1040" y="273" text-anchor="middle" font-size="10" fill="#6B7280">Endereco</text>

  <!-- Arrows Profile → submenus -->
  <line x1="860" y1="170" x2="840" y2="210" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="940" y1="170" x2="1040" y2="210" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== BANNER FILA ==================== -->
  <text x="900" y="340" text-anchor="middle" font-size="14" font-weight="600" fill="#6B7280">BANNER FILA ATIVA (Home)</text>

  <!-- Banner amarelo -->
  <rect x="760" y="360" width="280" height="50" rx="8" fill="#F59E0B"/>
  <text x="900" y="382" text-anchor="middle" font-size="12" font-weight="600" fill="white">Em fila ~25min</text>
  <text x="900" y="400" text-anchor="middle" font-size="10" fill="white" opacity="0.9">Corte Real 97616</text>
  <text x="1055" y="388" font-size="10" fill="#92400E">> 10 min</text>

  <!-- Banner vermelho -->
  <rect x="760" y="425" width="280" height="50" rx="8" fill="#EF4444"/>
  <text x="900" y="447" text-anchor="middle" font-size="12" font-weight="600" fill="white">Em fila ~5min</text>
  <text x="900" y="465" text-anchor="middle" font-size="10" fill="white" opacity="0.9">Corte Real 97616 — Va ao salao!</text>
  <text x="1055" y="453" font-size="10" fill="#991B1B">≤ 10 min</text>

  <!-- ==================== POLLING ADAPTATIVO ==================== -->
  <text x="900" y="530" text-anchor="middle" font-size="14" font-weight="600" fill="#6B7280">POLLING ADAPTATIVO</text>

  <rect x="760" y="545" width="280" height="120" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
  <text x="780" y="570" font-size="12" fill="#374151">⏱ > 60 min    → a cada 10 min</text>
  <text x="780" y="595" font-size="12" fill="#374151">⏱ 10-60 min   → a cada 5 min</text>
  <text x="780" y="620" font-size="12" fill="#374151">⏱ < 10 min    → a cada 1 min</text>
  <text x="780" y="650" font-size="11" fill="#6B7280" font-style="italic">Countdown local a cada 30s (offline OK)</text>

  <!-- ==================== LEGENDA ==================== -->
  <text x="100" y="700" font-size="14" font-weight="600" fill="#6B7280">LEGENDA</text>

  <rect x="80" y="720" width="20" height="20" rx="4" fill="#22C55E"/>
  <text x="110" y="735" font-size="12" fill="#374151">Tela principal / Acao positiva</text>

  <rect x="80" y="750" width="20" height="20" rx="4" fill="#F59E0B"/>
  <text x="110" y="765" font-size="12" fill="#374151">Fila / Urgencia normal (> 10min)</text>

  <rect x="80" y="780" width="20" height="20" rx="4" fill="#EF4444"/>
  <text x="110" y="795" font-size="12" fill="#374151">Urgencia alta (≤ 10min) / Cancelamento</text>

  <rect x="80" y="810" width="20" height="20" rx="4" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  <text x="110" y="825" font-size="12" fill="#374151">Auth (Login / SignUp)</text>

  <rect x="400" y="720" width="20" height="20" rx="4" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
  <text x="430" y="735" font-size="12" fill="#374151">Configuracoes / Futuro</text>

  <line x1="400" y1="760" x2="440" y2="760" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="450" y="765" font-size="12" fill="#374151">Navegacao opcional</text>

  <line x1="400" y1="790" x2="440" y2="790" stroke="#6B7280" stroke-width="2"/>
  <text x="450" y="795" font-size="12" fill="#374151">Navegacao principal</text>

  <!-- Footer -->
  <text x="600" y="870" text-anchor="middle" font-size="11" fill="#9CA3AF">VUPTH Client v1.0 — React Native + Expo SDK 54 — 126 testes + Maestro E2E</text>
</svg>
