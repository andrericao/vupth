# Abre o Partner limpo e entra como o profissional da loja de teste (bateria-
# conjunta). Os subfluxos sao os do vupth-partner (.maestro/conjunta), lidos do
# clone ao lado deste (../vupth-partner) — nada e copiado. O launchApp leva o
# appId do Partner explicito: um launchApp sem appId limparia o Client.
# Entradas: EMAIL_PROF
appId: ${APP_ID}
---
- launchApp:
    appId: com.vupth.partner.preview
    clearState: true
# A 1a abertura roda o bundle do APK e baixa o OTA; uma 2a o aplica (o mesmo
# do abrir_com_ota.yaml do Partner).
- extendedWaitUntil:
    visible: "Como você vai usar o Vupth?"
    timeout: ${120000 * LENTO}
- extendedWaitUntil:
    visible:
      id: "app-commit"
    timeout: ${15000 * LENTO}
    optional: true
- stopApp: com.vupth.partner.preview
- launchApp:
    appId: com.vupth.partner.preview
- extendedWaitUntil:
    visible: "Como você vai usar o Vupth?"
    timeout: ${120000 * LENTO}
- runFlow:
    file: ../../../vupth-partner/.maestro/conjunta/prof_entrar.yaml
    env:
      APP_ID: com.vupth.partner.preview
      EMAIL: ${EMAIL_PROF}
      SENHA: ${SENHA}
