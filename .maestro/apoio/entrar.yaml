# Entra com uma conta que ja existe, a partir do Perfil do visitante (o mesmo
# caminho da 09.07–09.15). Termina logado, com as caixas fechadas.
# Entrada: EMAIL_CLIENTE
appId: ${APP_ID}
---
- tapOn:
    text: "Perfil"
- tapOn:
    text: "Já tenho conta"
# No emulador (1 nucleo, 2 GB, swap) o inputText digita tecla a tecla e
# estourou o prazo de 120 s do Maestro no meio do e-mail (bateria 11/10 00:49,
# 00.P0, DEADLINE_EXCEEDED): cola pela area de transferencia.
- tapOn:
    text: "E-mail"
- setClipboard: ${EMAIL_CLIENTE}
- pasteText
- tapOn:
    text: "Senha"
- setClipboard: ${SENHA}
- pasteText
- hideKeyboard
- tapOn:
    id: "primary-login"
# O login pode demorar com o servidor lento e voltar com uma caixa de erro
# (bateria 09/10 20:30, 07.PA: a caixa fechou, o app seguiu deslogado e o
# "Sair da conta" nunca apareceu). Espera o desfecho e, se ainda estiver na
# tela de login, tenta mais uma vez (os campos continuam preenchidos).
- extendedWaitUntil:
    visible:
      id: "(dialogo-botao-0|busca-home)"
    timeout: ${90000 * LENTO}
    optional: true
- runFlow:
    file: fechar_aviso.yaml
- runFlow:
    when:
      visible:
        id: "primary-login"
    commands:
      # O 429 do staging (limite de logins, "try again in 45 s", 11/10): espera
      # o prazo antes de tocar de novo.
      - extendedWaitUntil:
          visible: "ESPERA_DO_429_NUNCA_APARECE"
          timeout: 47000
          optional: true
      - tapOn:
          id: "primary-login"
      - extendedWaitUntil:
          visible:
            id: "(dialogo-botao-0|busca-home)"
          timeout: ${90000 * LENTO}
          optional: true
      - runFlow:
          file: fechar_aviso.yaml
# No emulador lento o toque em Perfil as vezes nao troca a aba (bateria 10/10
# 19:16, 00.P0; a 01.03 das 17:30): toca de novo ate o Perfil logado abrir
# (os grupos do menu, testID grupo-*).
- repeat:
    times: 4
    while:
      notVisible:
        id: "grupo-.*"
    commands:
      - tapOn:
          text: "Perfil"
      - extendedWaitUntil:
          visible:
            id: "grupo-.*"
          timeout: ${10000 * LENTO}
          optional: true
- scrollUntilVisible:
    element:
      text: "Sair da conta"
    timeout: 30000
- runFlow:
    file: fechar_aviso.yaml
