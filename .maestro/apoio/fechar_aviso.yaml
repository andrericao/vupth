# Fecha a caixa de AVISO (um botao so: "OK"/"Entendi") e a de PERMISSAO do
# sistema, se estiverem na tela.
# Nunca use depois de uma CONFIRMACAO: la o botao 0 pode ser o "Nao".
# O Alert do app e o DialogoVupth nas duas plataformas, com testID por botao.
appId: ${APP_ID}
---
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible:
        id: "dialogo-botao-0"
    commands:
      - tapOn:
          id: "dialogo-botao-0"
# A caixa de PERMISSAO do sistema (localizacao na primeira abertura, notificacao
# depois do login): o app pede uma vez so, mas o `permissions: deny` do
# launchApp nao a impede no Android — ela aparece e o roteiro nega aqui.
# Em repeticao, nao um toque so (Andre 10/10 16h, "o teste trava com o popup
# de permissao"): o toque pode cair antes da caixa terminar de abrir e ela fica.
- repeat:
    times: 3
    while:
      visible:
        id: "com.android.permissioncontroller:id/permission_deny_button"
    commands:
      - tapOn:
          id: "com.android.permissioncontroller:id/permission_deny_button"
      - waitForAnimationToEnd:
          timeout: 2000
# A tela 10 (ligar-push-permission): na primeira entrada numa fila, antes da
# caixa do sistema. "Prefiro acompanhar pelo app" = o mesmo que negar.
- runFlow:
    when:
      visible:
        id: "push-skip"
    commands:
      - tapOn:
          id: "push-skip"
