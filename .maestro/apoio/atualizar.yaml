# A fatia de atualizacao (Andre, 05/10): em vez de fechar e abrir o app ate o
# OTA valer, o cliente logado vai em Perfil -> Versao do app e toca em
# "Verificar atualizacao". Se baixou, o OK reinicia o app no OTA novo. No fim
# confere o commit na linha da versao (para a etapa se nao bater).
#
# Comeca logado, em qualquer tela com a barra de abas. Termina na tela Sistema.
# Entrada: COMMIT (a bateria.sh o passa)
appId: ${APP_ID}
---
# O toque em Perfil se repete ate a aba trocar (emulador lento, ver entrar.yaml).
- repeat:
    times: 4
    while:
      notVisible:
        id: "grupo-.*"
    commands:
      - tapOn:
          text: "Perfil"
      - extendedWaitUntil:
          visible:
            id: "grupo-.*"
          timeout: ${10000 * LENTO}
          optional: true
- scrollUntilVisible:
    element:
      text: "Versão do app"
# botao-suporte (15/10): o menu Suporte fica logo acima do Sistema. So confere
# que esta la — o toque abre o navegador, fora do app.
- assertVisible:
    text: "Suporte"
    label: "o menu Suporte esta no Perfil"
- tapOn:
    text: "Versão do app"
- tapOn:
    id: "check-update"
- extendedWaitUntil:
    visible: "(Atualização baixada|Tudo certo|Não foi possível verificar)"
    timeout: ${60000 * LENTO}
# "Atualização baixada": o OK chama o reloadAsync e o app recomeca no Inicio.
- runFlow:
    when:
      visible: "Atualização baixada"
    commands:
      - tapOn:
          id: "dialogo-botao-0"
      - runFlow:
          file: esperar_negando.yaml
          env:
            ALVO: "busca-home"
      - repeat:
          times: 4
          while:
            notVisible:
              id: "grupo-.*"
          commands:
            - tapOn:
                text: "Perfil"
            - extendedWaitUntil:
                visible:
                  id: "grupo-.*"
                timeout: ${10000 * LENTO}
                optional: true
      - scrollUntilVisible:
          element:
            text: "Versão do app"
      - tapOn:
          text: "Versão do app"
# O OTA ainda nao chegou (Andre, 11/10: "reabra o app ate o OTA chegar"): o
# EAS Update pode estar publicando logo depois do push. Desde 16/10 o OTA e um
# job do CI, depois dos testes (~3,5 min + ~3,5 min): ate 14 voltas de 30 s —
# fecha a caixa, espera e verifica de novo. Sem COMMIT, o ".*.*" sempre aparece
# e a volta nao roda.
- repeat:
    times: 14
    while:
      notVisible:
        text: ".*${COMMIT}.*"
    commands:
      - runFlow:
          file: fechar_aviso.yaml
      - extendedWaitUntil:
          visible: "ESPERA_DO_OTA_NUNCA_APARECE"
          timeout: ${30000 * LENTO}
          optional: true
      - tapOn:
          id: "check-update"
      - extendedWaitUntil:
          visible: "(Atualização baixada|Tudo certo|Não foi possível verificar)"
          timeout: ${60000 * LENTO}
          optional: true
      - runFlow:
          when:
            visible: "Atualização baixada"
          commands:
            - tapOn:
                id: "dialogo-botao-0"
            - runFlow:
                file: esperar_negando.yaml
                env:
                  ALVO: "busca-home"
            - repeat:
                times: 4
                while:
                  notVisible:
                    id: "grupo-.*"
                commands:
                  - tapOn:
                      text: "Perfil"
                  - extendedWaitUntil:
                      visible:
                        id: "grupo-.*"
                      timeout: ${10000 * LENTO}
                      optional: true
            - scrollUntilVisible:
                element:
                  text: "Versão do app"
            - tapOn:
                text: "Versão do app"
      # Fecha o "Tudo certo" desta volta: com o aviso aberto por cima, a linha da versao nao esta
      # visivel e a condicao do repeat nunca ve o commit (a 00 reprovava com a versao certa na tela,
      # logs de 30/10 111922 e 212948).
      - runFlow:
          file: fechar_aviso.yaml
- runFlow:
    file: fechar_aviso.yaml
# Pelo texto, nao pelo id: o id cai no botao, e o copyTextFrom do botao devolve
# o accessibilityLabel ("Informações da versão"), nao a linha (log de 06/10).
- copyTextFrom:
    text: ".* · [0-9a-f]{8}"
- runScript:
    file: ../scripts/confere_versao.js
