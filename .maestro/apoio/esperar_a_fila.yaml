# Espera a tela da fila (queue-position) fechando o aviso "Sobre o tempo
# estimado" no meio do caminho. Ele abre a CADA entrada na tela da fila (salvo
# "Não mostrar novamente") e, como Modal, esconde o queue-position do Maestro
# (bateria 10/10 08:06: 11.08 e 21.04). Fecha tambem a politica da multa e a
# tela 10, que vem junto na primeira entrada. 20 voltas ~ 1 min.
appId: ${APP_ID}
---
- repeat:
    times: 20
    while:
      notVisible:
        id: "queue-position"
    commands:
      - runFlow:
          when:
            visible: "Sobre o tempo estimado"
          commands:
            - tapOn: "Entendi"
      # A politica da multa (bateria 10/10 15:32, 11.08 e 21.04): o Modal
      # tambem esconde a fila. O botao 0 e o "Ficar".
      - runFlow:
          when:
            visible: "Sua vez está chegando"
          commands:
            - tapOn:
                id: "dialogo-botao-0"
      # A tela 10 (21.04: veio por baixo da politica) e a caixa do sistema.
      - runFlow:
          file: fechar_aviso.yaml
      - extendedWaitUntil:
          visible:
            id: "queue-position"
          timeout: ${3000 * LENTO}
          optional: true
- assertVisible:
    id: "queue-position"
