# Do Inicio ate a loja de teste e o profissional dela. env: TAG, LOJA, PROF_ID
# A busca filtra por pedaco do nome: digitar so "C<tag>" deixa o campo com um
# texto diferente do nome inteiro, e o toque cai no card, nao no campo.
appId: ${APP_ID}
---
# fumaça 2026-11-05_164830 (00b.L1): no emulador lento o toque em Início passou sem trocar de aba (o Perfil
# seguiu na tela). Confere a troca pela busca e, se não veio, toca de novo.
- tapOn:
    text: "Início"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "busca-home"
    timeout: ${10000 * LENTO}
    optional: true
- runFlow:
    when:
      notVisible:
        id: "busca-home"
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn: "Início"
      - extendedWaitUntil:
          visible:
            id: "busca-home"
          timeout: ${20000 * LENTO}
- tapOn:
    id: "busca-home"
- eraseText: 30
- inputText: "C${TAG}"
- hideKeyboard
- extendedWaitUntil:
    visible: ${LOJA}
    timeout: ${30000 * LENTO}
- tapOn: ${LOJA}
- extendedWaitUntil:
    visible:
      id: "professional-${PROF_ID}"
    timeout: ${30000 * LENTO}
