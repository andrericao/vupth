# DEC-1 (Andre, 01/10): a multa nao aparece na escolha — so no total, numa
# linha somada, com o link para a explicacao (motivo, quem, quando).
# env: TAG, LOJA, PROF_ID, SERVICO_ID
appId: ${APP_ID}
---
- runFlow:
    file: ../apoio/abrir_a_loja.yaml
    label: "06.01 · roda abrir_a_loja"
- runFlow:
    file: ../apoio/escolher_servico.yaml
    label: "06.02 · roda escolher_servico"
- extendedWaitUntil:
    visible:
      id: "multas-pendentes"
    timeout: ${30000 * LENTO}
    label: "06.03 · espera multas-pendentes"
- tapOn:
    id: "ver-multas"
    label: "06.04 · toca em ver-multas"
- assertVisible:
    id: "explicacao-multas"
    label: "06.05 · vê explicacao-multas"
- assertVisible:
    text: "Multa pendente"
    label: "06.06 · vê Multa pendente"
- tapOn:
    text: "Entendi"
    label: "06.07 · toca em Entendi"

# multas-no-relatorio (André, 22/10): a multa pendente tambem aparece em
# Atendimentos, com a regra de quando e cobrada (DEC-93).
- tapOn:
    text: "Atendimentos"
    label: "06.08 · toca em Atendimentos"
- extendedWaitUntil:
    visible:
      id: "multas-em-atendimentos"
    timeout: ${30000 * LENTO}
    label: "06.09 · espera multas-em-atendimentos"
- assertVisible:
    text: "Cobradas junto do seu próximo corte."
    label: "06.0A · a multa diz que vai junto do próximo corte"
