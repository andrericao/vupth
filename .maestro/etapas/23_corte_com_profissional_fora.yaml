# Pedido de corte com o profissional em Fora (DEC-27, 0c1b968): o menu diz que
# quem decide e o profissional. "Assim que abrir" (sem desiredTime) tem prazo
# de 5 min tambem com ele em Fora — o expires_at so vem nulo com desiredTime em
# outro dia (Backend 34c0fbb, 09/10). A confirmacao e o Inicio seguem o prazo.
# Se o Andre decidir que em Fora o pedido nao vence, a 23 volta ao "sem prazo".
appId: ${APP_ID}
---
- tapOn:
    id: "more-options"
    label: "23.01 · toca em more-options"
- assertVisible:
    text: ".*A fila está fechada — peça o corte e o profissional decide.*"
    label: "23.02 · o menu diz que quem decide é o profissional"
- tapOn:
    id: "more-option-cut"
    label: "23.03 · toca em more-option-cut"
- tapOn:
    id: "corte-assim-que-abrir"
    label: "23.04 · toca em Assim que abrir"
- extendedWaitUntil:
    visible: "Pedido enviado!.*"
    timeout: ${30000 * LENTO}
    label: "23.05 · espera Pedido enviado!"
- assertVisible:
    text: ".*O profissional tem 5 minutos para responder.*"
    label: "23.06 · a confirmação diz o prazo de 5 minutos (expires_at do servidor)"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "23.08 · roda fechar_aviso"
- extendedWaitUntil:
    visible: ".*resposta até [0-9]{2}:[0-9]{2}.*"
    timeout: ${30000 * LENTO}
    label: "23.09 · o Início mostra o pedido com o prazo"
- runFlow:
    file: ../apoio/para_o_andre.yaml
    env:
      NOME: "23_pedido_com_prof_fora"
      O_QUE: "O pedido de corte no Início, com o prazo de 5 min, com o profissional em Fora"
    label: "23.10 · print para o André"
