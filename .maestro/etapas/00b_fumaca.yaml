# TESTE DE FUMACA (smoke test; teste-do-essencial, DEC-157): logar, marcar um serviço (entrar na fila) e pagar.
# O que o Maestro prova aqui: o app instalado abre, entra com e-mail e senha, põe o cliente na fila e, quando o
# profissional finaliza sem receber, abre o Pix do atendimento e aceita o "Já paguei".
# O que NÃO prova: dinheiro real nem o Pix do Asaas (isso é do Backend: sandbox e a pasta "essencial" do Newman).
# Comeca na escolha do servico, com o servico marcado e o cliente ja logado de novo (a avulsa faz o login).
# Conta e loja proprias da etapa (TAG), criadas pela API: nada do que muda no dado de producao entra aqui.
# env: EMAIL_PROF, NOME_CLIENTE
appId: ${APP_ID}
---
- tapOn:
    id: "primary-queue"
    label: "00b.01 · marcar: entra na fila"
- runFlow:
    file: ../apoio/confirmar_chegada.yaml
    label: "00b.02 · confirma o aviso 'Esteja na loja', se vier"
- extendedWaitUntil:
    visible: "(Entendi|É quase a sua vez!|Avisar|Agora não)"
    timeout: ${60000 * LENTO}
    optional: true
    label: "00b.03 · espera as caixas de confirmação"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "00b.04 · fecha as caixas"
- extendedWaitUntil:
    visible:
      id: "queue-position"
    timeout: ${60000 * LENTO}
    label: "00b.05 · a fila abre e mostra a posição"
- runFlow:
    file: ../apoio/abrir_partner.yaml
    label: "00b.06 · abre o Partner como o profissional"
- runFlow:
    file: ../../../vupth-partner/.maestro/conjunta/prof_finalizar.yaml
    env:
      APP_ID: com.vupth.partner.preview
      CLIENTE: ${NOME_CLIENTE}
      PAGAMENTO: "Ainda não"
    label: "00b.07 · no Partner, atende e finaliza ${NOME_CLIENTE} sem receber"
- launchApp:
    appId: ${APP_ID}
    label: "00b.08 · volta ao Client (sem limpar)"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "00b.09 · fecha as caixas"
- extendedWaitUntil:
    visible:
      id: "pix-do-atendimento"
    timeout: ${30000 * LENTO}
    optional: true
    label: "00b.10 · o Pix abre na tela da fila, se ela ainda estiver aberta"
- runFlow:
    when:
      visible:
        id: "pix-do-atendimento"
    commands:
      - tapOn:
          id: "pagamento-fechar"
    label: "00b.11 · fecha (a conta segue em Atendimentos)"
- tapOn:
    id: "faixa-avaliar-fechar"
    optional: true
    label: "00b.12 · fecha a faixa de avaliar, se apareceu"
- tapOn:
    text: "Atendimentos"
    label: "00b.13 · toca em Atendimentos"
- extendedWaitUntil:
    visible:
      id: "pagamentos-pendentes"
    timeout: ${60000 * LENTO}
    label: "00b.14 · pagar: o que falta pagar aparece no topo"
- tapOn:
    id: "pagar-.*"
    label: "00b.15 · abre o Pix"
- extendedWaitUntil:
    visible:
      id: "pix-ja-paguei"
    timeout: ${20000 * LENTO}
    label: "00b.16 · o Pix mostra o Já paguei"
- tapOn:
    id: "pix-ja-paguei"
    label: "00b.17 · toca em Já paguei"
- extendedWaitUntil:
    visible: "Aguardando o profissional confirmar"
    timeout: ${20000 * LENTO}
    label: "00b.18 · o pagamento fica aguardando o profissional"
- tapOn:
    id: "pix-ok"
    label: "00b.19 · fecha o Pix"
