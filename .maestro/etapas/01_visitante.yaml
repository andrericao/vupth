# Visitante (sem conta). Andre, 02/10: no Perfil ele ve SO o convite —
# Criar conta e Entrar —, os Termos e a versao. Nenhum grupo de menu.
appId: ${APP_ID}
---
# entrar-atras-da-barra (Andre, 09/10): o "Já tem conta? Entrar" ficava atras
# da barra de navegacao do celular. O toque do Maestro cai no centro do
# elemento: se ele estiver sob a barra, o toque vai para o sistema e o login
# nao abre. Entra pelo "Entrar" e volta: o visitante segue sem conta.
- tapOn:
    id: "onboarding-login"
    label: "01.01 · toca em Já tem conta? Entrar"
- extendedWaitUntil:
    visible:
      id: "primary-login"
    timeout: 10000
    label: "01.01b · o login abriu (o Entrar não está atrás da barra)"
- back:
    label: "01.01c · volta ao Início, sem conta"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "01.02 · roda fechar_aviso"

- tapOn:
    text: "Perfil"
    label: "01.03 · toca em Perfil"
- assertVisible:
    text: "Criar conta grátis"
    label: "01.04 · vê Criar conta grátis"
- assertVisible:
    text: "Já tenho conta"
    label: "01.05 · vê Já tenho conta"
- assertVisible:
    id: "terms"
    label: "01.06 · vê terms"
# A versao e o primeiro lugar em que o commit aparece: se nao for o esperado,
# a bateria para aqui (bateria-confere-versao, 03/10).
- runFlow:
    file: ../apoio/confere_versao.yaml
    label: "01.07 · confere a versão (commit) em versao-visitante"
- assertNotVisible:
    text: "APARÊNCIA"
    label: "01.08 · não vê APARÊNCIA"
- assertNotVisible:
    text: "SISTEMA"
    label: "01.09 · não vê SISTEMA"
- assertNotVisible:
    text: "CONTA"
    label: "01.10 · não vê CONTA"
- assertNotVisible:
    text: "Sair da conta"
    label: "01.11 · não vê Sair da conta"
