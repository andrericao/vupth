# Visitante (sem conta). Andre, 02/10: no Perfil ele ve SO o convite —
# Criar conta e Entrar —, os Termos e a versao. Nenhum grupo de menu.
appId: ${APP_ID}
---
# entrar-atras-da-barra (Andre, 09/10): o botao "Entrar" ficava atras
# da barra de navegacao do celular. O toque do Maestro cai no centro do
# elemento: se ele estiver sob a barra, o toque vai para o sistema e o login
# nao abre. Entra pelo "Entrar" e volta: o visitante segue sem conta.
#
# A entrada so e conferida no OTA (bateria 10/10 15:32, 01.01): o clearState
# do preparo apaga o OTA e a primeira abertura roda o bundle EMBUTIDO do APK —
# a arvore da falha nao tinha o onboarding-rolagem nem o onboarding-rodape, e
# nenhuma correcao da entrada chegava ao teste. Fecha e abre (sem limpar) ate
# a versao do rodape da entrada mostrar o commit esperado; o OTA baixa na
# primeira abertura e vale na seguinte.
- repeat:
    times: 3
    while:
      true: ${typeof COMMIT !== 'undefined' && !!COMMIT}
      notVisible:
        id: "versao-entrada"
        text: ".*${typeof COMMIT !== 'undefined' ? COMMIT : ''}.*"
    commands:
      - stopApp
      - launchApp
      - runFlow:
          file: ../apoio/esperar_negando.yaml
          env:
            ALVO: "onboarding-start"
      - runFlow:
          file: ../apoio/fechar_aviso.yaml
    label: "01.00 · reabre até a entrada rodar o OTA (o commit no rodape)"
# termos-no-rodape + tela-de-entrada (17/10): o rodape fixo da entrada traz os
# dois links legais, acima da versao.
- assertVisible:
    id: "link-termos"
    label: "01.00a · a entrada mostra Termos de uso no rodape fixo"
- assertVisible:
    id: "link-privacidade"
    label: "01.00b · a entrada mostra Política de privacidade no rodape fixo"
- tapOn:
    id: "onboarding-login"
    label: "01.01 · toca no botão Entrar"
- extendedWaitUntil:
    visible:
      id: "primary-login"
    timeout: ${10000 * LENTO}
    label: "01.01b · o login abriu (o Entrar não está atrás da barra)"
- back:
    label: "01.01c · volta ao Início, sem conta"
# card-oscila (Andre, 10/10): no bundle do APK o card da loja vinha sem a nota
# e sem a distancia. No OTA, todo card tem a nota (a distancia depende do GPS,
# negado na bateria: "Ligue o GPS").
- extendedWaitUntil:
    visible:
      id: "nota-.*"
    timeout: ${30000 * LENTO}
    label: "01.01d · o card da loja mostra a nota (card-oscila)"
- assertVisible:
    text: "Ligue o GPS"
    label: "01.01e · sem GPS, o card pede o GPS no lugar da distância"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "01.02 · roda fechar_aviso"

# No emulador lento (bateria 10/10 17:30, 01.04) o toque levou 41 s e nao
# trocou a aba: toca de novo ate o Perfil do visitante abrir.
- repeat:
    times: 4
    while:
      notVisible: "Criar conta grátis"
    commands:
      - tapOn:
          text: "Perfil"
      - extendedWaitUntil:
          visible: "Criar conta grátis"
          timeout: ${10000 * LENTO}
          optional: true
    label: "01.03 · toca em Perfil (de novo, se a aba não trocou)"
- assertVisible:
    text: "Criar conta grátis"
    label: "01.04 · vê Criar conta grátis"
- assertVisible:
    text: "Já tenho conta"
    label: "01.05 · vê Já tenho conta"
- assertVisible:
    id: "link-termos"
    label: "01.06 · vê Termos de uso (os dois links legais do Perfil)"
# A versao e o primeiro lugar em que o commit aparece: se nao for o esperado,
# a bateria para aqui (bateria-confere-versao, 03/10).
- runFlow:
    file: ../apoio/confere_versao.yaml
    label: "01.07 · confere a versão (commit) em versao-visitante"
- assertNotVisible:
    text: "APARÊNCIA"
    label: "01.08 · não vê APARÊNCIA"
- assertNotVisible:
    text: "SISTEMA"
    label: "01.09 · não vê SISTEMA"
- assertNotVisible:
    text: "CONTA"
    label: "01.10 · não vê CONTA"
- assertNotVisible:
    text: "Sair da conta"
    label: "01.11 · não vê Sair da conta"
