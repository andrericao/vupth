# A tela 10 (ligar-push-permission, 62e8ae9): na primeira entrada numa fila,
# antes da caixa do sistema. "Avisar" deixa a caixa vir.
appId: ${APP_ID}
---
- tapOn:
    id: "primary-queue"
    label: "24.01 · toca em primary-queue"
- runFlow:
    file: ../apoio/confirmar_chegada.yaml
    label: "24.01b · confirma o aviso 'Esteja na loja', se vier"
- extendedWaitUntil:
    visible: "Entendi"
    timeout: ${60000 * LENTO}
    label: "24.02 · espera Entendi"
- tapOn:
    text: "Entendi"
    label: "24.03 · toca em Entendi"
# O push da vez e uma caixa
# (Modal) e fica POR CIMA da tela 10, que e uma camada na raiz: com uma delas
# aberta o texto da tela 10 nem aparece na arvore (bateria 09/10 20:30, 24.04).
# Fecha pelo botao 0 ("OK") — nunca o
# fechar_aviso aqui: ele tocaria em "Agora não".
- repeat:
    times: 3
    while:
      visible: "É quase a sua vez!"
    commands:
      - tapOn:
          id: "dialogo-botao-0"
      - waitForAnimationToEnd:
          timeout: 3000
    label: "24.0A · fecha o push da vez, se cobre a tela 10"
- extendedWaitUntil:
    visible: "PODE FECHAR O APP"
    timeout: ${30000 * LENTO}
    label: "24.04 · espera a tela 10"
- runFlow:
    file: ../apoio/para_o_andre.yaml
    env:
      NOME: "24_tela_do_push"
      O_QUE: "A tela 10 por cima da fila, antes da caixa do sistema"
    label: "24.05 · print para o André"
- tapOn:
    id: "push-accept"
    label: "24.06 · toca em Avisar"
- extendedWaitUntil:
    visible:
      id: "com.android.permissioncontroller:id/permission_allow_button"
    timeout: ${30000 * LENTO}
    label: "24.07 · a caixa do sistema aparece"
- tapOn:
    id: "com.android.permissioncontroller:id/permission_allow_button"
    label: "24.08 · permite"
- assertNotVisible:
    text: "PODE FECHAR O APP"
    label: "24.09 · a tela 10 saiu"
# Daqui, os avisos da fila de sempre (o push da vez).
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "24.10 · roda fechar_aviso"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "24.11 · roda fechar_aviso"
- extendedWaitUntil:
    visible:
      id: "queue-position"
    timeout: ${30000 * LENTO}
    label: "24.12 · a fila segue na tela"
