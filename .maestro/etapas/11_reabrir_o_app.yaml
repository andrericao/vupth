# Fechar e abrir o app com o cliente na fila (o pedido aceito da etapa 10):
# nada do que ja foi respondido volta — a caixa de notificacao do app e a do
# sistema (permissoes-repetidas) e o aviso da estimativa.
appId: ${APP_ID}
---
- stopApp:
    label: "11.01 · fecha o app"
- launchApp:
    label: "11.02 · abre o app de novo (sem limpar)"
- extendedWaitUntil:
    visible:
      id: "card-da-fila"
    timeout: ${120000 * LENTO}
    label: "11.03 · espera card-da-fila no Início"
- waitForAnimationToEnd:
    timeout: 3000
    label: "11.04 · espera a tela parar"
- assertNotVisible:
    id: "com.android.permissioncontroller:id/permission_deny_button"
    label: "11.05 · não vê a caixa de permissão do sistema"
- assertNotVisible:
    id: "push-skip"
    label: "11.06 · não vê a caixa de notificação do app"
- tapOn:
    id: "card-da-fila"
    label: "11.07 · toca em card-da-fila"
- runFlow:
    file: ../apoio/esperar_a_fila.yaml
    label: "11.08 · espera queue-position (fecha o aviso da estimativa)"
- waitForAnimationToEnd:
    timeout: 3000
    label: "11.09 · espera a tela parar"
# bateria 25/10 01:28 (11.10): o aviso abre a cada entrada na fila e vem de uma leitura assincrona; no emulador
# lento ele pode chegar DEPOIS do queue-position (e o 11.08 sair sem fecha-lo) ou ainda estar no fade-out do
# "Entendi". Espera o aviso um instante, fecha se ele veio, e so entao confere que nao ficou na tela.
# O "i" do topo da tela Aguardando tem o rotulo "Sobre o tempo estimado" e fica SEMPRE na tela (bateria 155718, 11.10):
# o aviso (modal) se reconhece pelo botao "Entendi".
- extendedWaitUntil:
    visible: "Entendi"
    timeout: ${5000 * LENTO}
    optional: true
    label: "11.09b · o aviso pode chegar um instante depois do queue-position"
- runFlow:
    when:
      visible: "Entendi"
    commands:
      # O aviso pode sumir sozinho entre o `when` e o toque (bateria 131517, 11.09c): sem ele, nao e falha.
      - tapOn:
          text: "Entendi"
          optional: true
    label: "11.09c · fecha o aviso, se ele chegou"
- extendedWaitUntil:
    notVisible: "Entendi"
    timeout: ${10000 * LENTO}
    label: "11.10 · não vê o aviso da estimativa de novo (espera o fade-out)"
