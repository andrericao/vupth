# C20 (Andre, 05/08): com a fila aberta, as DUAS portas na tela — entrar agora
# ou agendar. A regra da multa aparece antes do toque que poe na fila (CDC).
# env: PROF_ID, SERVICO_ID
appId: ${APP_ID}
---
# fluxo-sem-tela-duplicada (André, 03/11): o botão tocado na loja define a intenção; a escolha de
# serviços só a confirma. Começa na tela da loja (a etapa 03 termina nela) e volta para ela.
- tapOn:
    id: "agendar-loja-aberta"
    label: "04.00a · toca em Agendar um horário, na loja"
- extendedWaitUntil:
    visible:
      id: "service-.*"
    timeout: ${30000 * LENTO}
    label: "04.00b · espera os serviços"
- tapOn:
    id: "service-.*"
    index: 0
    label: "04.00c · marca um serviço"
- assertVisible:
    id: "primary-schedule"
    label: "04.00d · vê só o Agendar"
- assertNotVisible:
    id: "primary-queue"
    label: "04.00e · não vê Entrar na fila"
- assertNotVisible:
    id: "more-options"
    label: "04.00f · não vê Mais opções"
- back:
    label: "04.00g · volta para a loja"
- tapOn:
    id: "entrar-loja-aberta"
    label: "04.00h · toca em Entrar com menor espera, na loja"
- extendedWaitUntil:
    visible:
      id: "service-.*"
    timeout: ${30000 * LENTO}
    label: "04.00i · espera os serviços"
- tapOn:
    id: "service-.*"
    index: 0
    label: "04.00j · marca um serviço"
- assertVisible:
    id: "primary-queue"
    label: "04.00k · vê Entrar na fila"
- assertNotVisible:
    id: "second-door-schedule"
    label: "04.00l · não vê a segunda porta"
- back:
    label: "04.00m · volta para a loja"
- runFlow:
    file: ../apoio/escolher_servico.yaml
    label: "04.01 · roda escolher_servico"
- assertVisible:
    id: "primary-queue"
    label: "04.02 · vê primary-queue"
- assertVisible:
    id: "second-door-schedule"
    label: "04.03 · vê second-door-schedule"
# Na escolha do servico, nenhum aviso de multa (DEC-1; Andre, 05/10).
- assertNotVisible:
    id: "regra-da-multa"
    label: "04.04 · não vê regra-da-multa"
# politica-de-preco-saiba-mais (DEC-91): o resumo explica o preco e o "Saiba mais"
# leva ao artigo do Suporte (o toque abre o navegador, fora do app: so se confere
# que o link esta na tela).
- assertVisible:
    id: "preco-saiba-mais"
    label: "04.04a · vê o Saiba mais do preço"
# O agendar saiu do "Mais opcoes": la sobra so a troca.
- tapOn:
    id: "more-options"
    label: "04.05 · toca em more-options"
- assertVisible:
    id: "more-option-swap"
    label: "04.06 · vê more-option-swap"
- assertNotVisible:
    id: "more-option-schedule"
    label: "04.07 · não vê more-option-schedule"
- tapOn:
    id: "more-options-close"
    label: "04.08 · toca em more-options-close"
