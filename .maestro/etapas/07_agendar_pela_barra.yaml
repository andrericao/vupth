# A segunda porta: agendar um horario pela barra de encaixe (DEC-3). Continua
# na escolha de servicos da etapa 06, com o servico marcado.
appId: ${APP_ID}
---
- tapOn:
    id: "second-door-schedule"
    label: "07.01 · toca em second-door-schedule"
# A barra so aparece depois de escolher o dia (o modal abre sem dia marcado;
# era o "barra-de-encaixe is visible" que falhou em 05/10). Hoje: a loja da
# bateria esta aberta agora (loja_aberta).
- tapOn:
    text: "Hoje"
    label: "07.01b · escolhe o dia: Hoje"
- extendedWaitUntil:
    visible:
      id: "barra-de-encaixe"
    timeout: 30000
    label: "07.02 · espera barra-de-encaixe"
- tapOn:
    id: "horario-.*"
    index: 0
    label: "07.03 · toca em horario-.*"
- tapOn:
    id: "confirmar-agendamento"
    label: "07.04 · toca em confirmar-agendamento"
- extendedWaitUntil:
    visible: "Agendado"
    timeout: 30000
    label: "07.05 · espera Agendado"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "07.06 · roda fechar_aviso"

# Aparece em Atendimentos.
- tapOn:
    text: "Atendimentos"
    label: "07.07 · toca em Atendimentos"
- extendedWaitUntil:
    visible: ${PROF}
    timeout: 30000
    label: "07.08 · espera ${PROF}"
