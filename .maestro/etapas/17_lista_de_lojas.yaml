# Inicio -> "Ver todos": a lista de lojas, com a ordem trocavel, e o toque abre
# a loja de teste (maestro-maximo). Com o Pra ontem ligado o link e "Ver todas"
# (desliga o filtro); entao o "Ver todos" aparece.
# env: LOJA_ID, PROF_ID
appId: ${APP_ID}
---
- tapOn:
    text: "Início"
    label: "17.01 · toca em Início"
# distancia-no-card (Andre, 09/10): a bateria nega a localizacao, entao o card
# mostra "Ligue o GPS" no lugar da distancia, com o icone de local.
- extendedWaitUntil:
    visible: "Ligue o GPS|[0-9]+([,.][0-9]+)? ?(m|km)"
    timeout: ${30000 * LENTO}
    label: "17.0G · o card do Início diz Ligue o GPS (sem GPS) ou mostra a distância (com GPS, como no celular)"
# carrossel-de-campanhas-na-home (23/10): o bloco so existe com campanha criada
# no Painel; se existir, o toque abre os detalhes e o Fechar volta ao Inicio.
- runFlow:
    when:
      visible:
        id: "campanhas-da-home"
    commands:
      - tapOn:
          id: "campanhas-da-home"
      - tapOn:
          text: "Fechar"
    label: "17.0H · campanha da Home: toque abre os detalhes, Fechar volta"
- runFlow:
    when:
      notVisible:
        id: "see-all"
    commands:
      - tapOn:
          text: "Ver todas"
    label: "17.02 · desliga o Pra ontem, se estiver ligado"
- tapOn:
    id: "see-all"
    label: "17.03 · toca em Ver todos"
# A troca de ordem (sort-toggle) so existe com distancia, e a bateria nega a
# localizacao: espera a contagem da lista (bateria 09/10 20:30, 17.04).
- extendedWaitUntil:
    visible: "(Nenhuma aberta agora|[0-9]+ abertas? agora)"
    timeout: ${30000 * LENTO}
    label: "17.04 · espera a lista de lojas"
- runFlow:
    when:
      visible:
        id: "sort-toggle"
    commands:
      - tapOn:
          id: "sort-toggle"
    label: "17.05 · troca a ordem, se houver distância"
# O staging tem centenas de lojas abertas (344 em 31/10, bateria 155718): rolar ate a de teste estoura o tempo.
# Busca pelo nome, que o preparo devolveu em LOJA.
- tapOn:
    text: "Buscar pelo nome"
    label: "17.05b · toca na busca"
- inputText:
    text: ${LOJA}
    label: "17.05c · digita o nome da loja de teste"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "establishment-${LOJA_ID}"
    timeout: ${60000 * LENTO}
    label: "17.06 · acha a loja de teste na lista"
- tapOn:
    id: "establishment-${LOJA_ID}"
    label: "17.07 · abre a loja"
- extendedWaitUntil:
    visible:
      id: "professional-${PROF_ID}"
    timeout: ${30000 * LENTO}
    label: "17.08 · a loja abre com o profissional"
