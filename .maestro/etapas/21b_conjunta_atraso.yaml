# Etapa 21b (etapas-curtas, 15/10: a 21 virou 21a + 21b; a abertura da fila
# pelo card ficou na 21a). Bateria conjunta: o profissional marca no Partner que
# o cliente nao chegou; o Client, aberto de novo, mostra o aviso "Este e o seu
# 1º atraso" com Entendi e a fila "Atrasado" (aviso-de-atraso, contagem-de-
# atrasos). O aviso vive no App (useAvisoDeAtraso), nao na tela da fila: vale
# em qualquer tela. O Partner so marca 5 min depois do horario: a etapa espera
# com o Client FECHADO (menos memoria no aparelho, que caia na 21.0B).
# Comeca logado, ja na fila (entrou pela API), com o app fechado.
# env: EMAIL_PROF, NOME_CLIENTE
appId: ${APP_ID}
---
# O Partner so deixa marcar atraso 5 min depois do horario. E tempo de relogio,
# nao de aparelho: sem LENTO (no emulador virava 11 min e o adb caia, "device
# offline", baterias 11/10 06:06 e 07:02). 11 voltas de 30 s, com o "Wait" do
# aviso de ANR entre elas.
- repeat:
    times: 11
    commands:
      - extendedWaitUntil:
          visible: "esta-tela-nao-tem-este-texto"
          timeout: ${30000 * LENTO}
          optional: true
      - runFlow:
          file: ../apoio/esperar_o_sistema.yaml
    label: "21.07 · espera 5 min e meio"
- runFlow:
    file: ../apoio/abrir_partner.yaml
    label: "21.08 · abre o Partner como o profissional"
- runFlow:
    file: ../../../vupth-partner/.maestro/conjunta/prof_marcar_atraso.yaml
    env:
      APP_ID: com.vupth.partner.preview
      CLIENTE: ${NOME_CLIENTE}
    label: "21.09 · no Partner, marca que ${NOME_CLIENTE} não chegou"
# Fecha o Partner antes: com os dois apps abertos no emulador de 1,5 GB o
# driver do Maestro caia logo depois (21.0B: "device offline" as 09:58,
# "UiAutomation not connected" as 11:43).
- stopApp:
    appId: com.vupth.partner.preview
    label: "21.09b · fecha o Partner"
# O Client estava fechado durante a espera: abre de novo, sem limpar (o login
# e o OTA ficam), e a abertura traz a fila ja com o atraso do servidor.
- launchApp:
    appId: ${APP_ID}
    stopApp: false
    permissions:
      location: deny
      notifications: deny
    label: "21.0A · abre o Client de novo (sem limpar)"
- extendedWaitUntil:
    visible: ".*Este é o seu 1º atraso.*"
    timeout: ${60000 * LENTO}
    label: "21.0B · o aviso do 1º atraso aparece"
- tapOn:
    text: "Entendi"
    label: "21.0C · toca em Entendi"
- tapOn:
    id: "card-da-fila"
    label: "21.0D · abre a fila"
- extendedWaitUntil:
    visible: "Atrasado"
    timeout: ${30000 * LENTO}
    label: "21.0E · a fila mostra Atrasado"
