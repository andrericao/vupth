# Entra na fila (primeiro da fila = menos de 1 hora) e sai: a saida pede
# confirmacao e gera a multa que a etapa 06 confere no total.
appId: ${APP_ID}
---
- tapOn:
    id: "primary-queue"
    label: "05.01 · toca em primary-queue"

- runFlow:
    file: ../apoio/confirmar_chegada.yaml
    label: "05.01b · confirma o aviso 'Esteja na loja', se vier"
# O push "É quase a sua vez!" pode chegar antes do Entendi e cobri-lo
# (bateria 09/10 15:13): espera o que vier primeiro e fecha o push, se for ele.
- extendedWaitUntil:
    visible: "(Entendi|É quase a sua vez!|Avisar|Agora não)"
    timeout: ${60000 * LENTO}
    label: "05.02 · espera a próxima tela de confirmação"

- runFlow:
    when:
      visible: "É quase a sua vez!"
    commands:
      - tapOn:
          id: "dialogo-botao-0"
    label: "05.02b · fecha o push da vez, se veio antes do Entendi"

- extendedWaitUntil:
    visible: "(Entendi|Avisar|Agora não)"
    timeout: ${10000 * LENTO}
    optional: true
    label: "05.02c · espera a próxima tela de confirmação"

- runFlow:
    when:
      visible: "Avisar"
    commands:
      - tapOn:
          text: "Avisar"
    label: "05.02d · fecha a caixa de aviso 'Pode fechar o app'"

- runFlow:
    when:
      visible: "Agora não"
    commands:
      - tapOn:
          text: "Agora não"
    label: "05.02e · fecha a opção 'Agora não'"

- runFlow:
    when:
      visible: "Entendi"
    commands:
      - tapOn:
          text: "Entendi"
    label: "05.03 · toca em Entendi"

# O primeiro da fila recebe o push "É quase a sua vez!" logo ao entrar; com o
# app aberto ele vira uma caixa com "OK" que cobre a tela (o queue-position some
# da arvore). Na entrada nao ha mais o aviso de tres botoes:
# só a faixa da tolerancia. Fecha o push, se veio.
- extendedWaitUntil:
    visible: "É quase a sua vez!"
    timeout: ${8000 * LENTO}
    optional: true
    label: "05.08 · espera o push da vez, se ainda nao veio"

- runFlow:
    when:
      visible: "É quase a sua vez!"
    commands:
      - tapOn:
          id: "dialogo-botao-0"
    label: "05.09 · fecha o push da vez"

- extendedWaitUntil:
    visible:
      id: "queue-position"
    timeout: ${30000 * LENTO}
    label: "05.10 · espera queue-position"

# A etapa e de SAIR COM MULTA (Andre, 04/10): dentro da tolerancia ("Voce pode
# sair da fila sem custo ate HH:MM") a saida e de graca. Espera a faixa sumir —
# o horario dela e o do servidor — e so entao sai.
# Em laço, conferindo de novo depois de 5 s: a faixa pode sumir por um
# instante num re-render, e um notVisible so passava cedo (bateria 09/10
# 20:30, 06: passou em 33 s com "sem custo até 20:50" na tela, e a saida foi de
# graca, sem a caixa "Sair da fila?").
# Voltas de 30 s, com o "Wait" do ANR entre elas: a tolerancia e tempo de
# relogio, e uma espera longa e continua derrubava o adb no emulador ("device
# offline" na 06, baterias 11/10 23:57 e 12/10 02:09). 40 voltas cobrem os
# 15 min da tolerancia com folga.
# bateria 25/10 01:28 (05.1D): o `while: visible` saiu cedo — o log mostra UMA volta em 05.11 e uma em
# 05.1C, e a faixa "sem custo ate 04:01" seguia na tela com o relogio do aparelho em 03:59. A checagem do
# `while` e instantanea e erra no emulador lento. Agora o laco NAO tem `while`: roda as 40 voltas e cada uma
# espera a faixa sumir (30 s); com ela ja fora, o extendedWaitUntil volta na hora e as voltas que sobram
# custam quase nada.
- repeat:
    times: 40
    commands:
      # A tela "Pode fechar o app" (Avisar / Agora não) sobe no meio da espera e COBRE a faixa: com ela por cima o
      # notVisible passa na hora e o laco acabava em ~2 min, ate a tolerancia terminar so 1 min depois (bateria 191016:
      # faixa "ate 19:31" com o relogio em 19:30). Fecha a cada volta, para a espera valer de fato.
      - runFlow:
          when:
            visible: "Agora não"
          commands:
            - tapOn:
                text: "Agora não"
          label: "05.1Ca · fecha o 'Pode fechar o app', se cobriu a faixa"
      - extendedWaitUntil:
          notVisible:
            text: ".*(sem|em).*custo.*"
          timeout: ${30000 * LENTO}
          optional: true
      - runFlow:
          file: ../apoio/esperar_o_sistema.yaml
      # A pausa de 5 s antes da proxima volta: se a faixa so sumiu por um instante (re-render), ela volta e a
      # volta seguinte espera de novo. Sumiu de vez: as voltas que sobram custam 5 s cada.
      - extendedWaitUntil:
          visible:
            text: ".*(sem|em).*custo.*"
          timeout: ${5000 * LENTO}
          optional: true
    label: "05.11 · espera a tolerância acabar (a faixa sem custo some)"
# Uma caixa por cima (o push da vez com o app aberto) tambem esconde a faixa:
# fecha e confere de novo, com a tela livre.
- runFlow:
    when:
      visible: "É quase a sua vez!"
    commands:
      - tapOn:
          id: "dialogo-botao-0"
    label: "05.1A · fecha o push da vez, se cobriu a faixa"
- extendedWaitUntil:
    visible:
      id: "queue-options"
    timeout: ${10000 * LENTO}
    label: "05.1B · a tela da fila está livre"
- repeat:
    times: 30
    commands:
      # A tela "Pode fechar o app" (Avisar / Agora não) sobe no meio da espera e COBRE a faixa: com ela por cima o
      # notVisible passa na hora e o laco acabava em ~2 min, ate a tolerancia terminar so 1 min depois (bateria 191016:
      # faixa "ate 19:31" com o relogio em 19:30). Fecha a cada volta, para a espera valer de fato.
      - runFlow:
          when:
            visible: "Agora não"
          commands:
            - tapOn:
                text: "Agora não"
          label: "05.1Ca · fecha o 'Pode fechar o app', se cobriu a faixa"
      - extendedWaitUntil:
          notVisible:
            text: ".*(sem|em).*custo.*"
          timeout: ${30000 * LENTO}
          optional: true
      - runFlow:
          file: ../apoio/esperar_o_sistema.yaml
    label: "05.1C · a faixa sem custo saiu de vez (voltas de 30 s)"
# A tela "Pode fechar o app" (Avisar / Agora não) pode subir depois da tolerancia e cobrir a fila: o texto da
# faixa segue na arvore por baixo dela e o assertNotVisible reprovava (bateria 131517, 05.1D). Fecha e confere.
- runFlow:
    when:
      visible: "Agora não"
    commands:
      - tapOn:
          text: "Agora não"
    label: "05.1C2 · fecha o 'Pode fechar o app', se subiu depois da tolerância"
# bateria 230153: as 30 voltas acabaram com a faixa "ate 23:23" e o relogio em 23:23 (o relogio do aparelho e o do
# servidor diferem por ~1 min). Espera ate 3 min a faixa sumir de fato antes de conferir.
- extendedWaitUntil:
    notVisible:
      text: ".*(sem|em).*custo.*"
    timeout: ${180000 * LENTO}
    optional: true
    label: "05.1C3 · espera a faixa sair (ate 3 min de folga)"
- assertNotVisible:
    text: ".*(sem|em).*custo.*"
    label: "05.1D · confere que a faixa saiu"

# sair-da-fila-toque-duplo-vermelho (30/10) e fila-aguardando-do-mockup (CLI-32): "Sair da fila"
# mora em Opcoes. O pedido ("Toque duas vezes seguidas para sair.", em vermelho) esta sempre na
# descricao da opcao, uma vez so. A saida exige dois toques RAPIDOS (500 ms, JANELA_DO_TOQUE_DUPLO_MS):
# um toque, uma pausa e outro toque nao sai; o doubleTapOn sai.
- tapOn:
    id: "queue-options"
    label: "05.1E · abre Opções"
- assertVisible:
    text: "Toque duas vezes seguidas para sair."
    label: "05.1F · o pedido do duplo toque já está na opção"
- tapOn:
    id: "more-option-leave-queue"
    label: "05.1G · um toque em Sair da fila"
- extendedWaitUntil:
    visible: "Toque duas vezes seguidas para sair."
    timeout: 3000
    label: "05.1H · um toque só não sai (o menu segue aberto)"
- tapOn:
    id: "more-option-leave-queue"
    label: "05.1I · outro toque, depois da pausa"
- assertNotVisible:
    text: ".*de multa no próximo atendimento.*"
    label: "05.1J · um toque, pausa e outro toque não abrem a caixa de saída"

- doubleTapOn:
    id: "more-option-leave-queue"
    label: "05.12 · toque duplo em Sair da fila"
# textos-curtos (guia 4.1): o titulo da caixa e "Sair da fila", igual ao botao da
# tela; por isso espera a LINHA da multa, que so a caixa tem.
- extendedWaitUntil:
    visible: ".*de multa no próximo atendimento.*"
    timeout: ${10000 * LENTO}
    label: "05.13 · espera a caixa Sair da fila (a linha da multa)"
- assertVisible:
    text: "Cancelar"
    label: "05.13b · a caixa oferece Cancelar"
- assertNotVisible:
    text: "Adiar"
    label: "05.13c · sem o botao Adiar"
# A caixa so tem dois botoes (entrada-e-saida-da-fila, 22/10; textos-curtos):
# "Cancelar" e "Sair". Pelo id do destrutivo.
- tapOn:
    id: "dialogo-botao-destrutivo"
    label: "05.14 · toca em Sair"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "05.15 · roda fechar_aviso"
