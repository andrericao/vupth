# Entra na fila (primeiro da fila = menos de 1 hora) e sai: a saida pede
# confirmacao e gera a multa que a etapa 06 confere no total.
appId: ${APP_ID}
---
- tapOn:
    id: "primary-queue"
    label: "05.01 · toca em primary-queue"
- runFlow:
    file: ../apoio/confirmar_chegada.yaml
    label: "05.01b · confirma o aviso 'Esteja na loja', se vier"
# O push "É quase a sua vez!" pode chegar antes do Entendi e cobri-lo
# (bateria 09/10 15:13): espera o que vier primeiro e fecha o push, se for ele.
- extendedWaitUntil:
    visible: "(Entendi|É quase a sua vez!)"
    timeout: ${60000 * LENTO}
    label: "05.02 · espera Entendi ou o push da vez"
- runFlow:
    when:
      visible: "É quase a sua vez!"
    commands:
      - tapOn:
          id: "dialogo-botao-0"
    label: "05.02b · fecha o push da vez, se veio antes do Entendi"
- extendedWaitUntil:
    visible: "Entendi"
    timeout: ${10000 * LENTO}
    label: "05.02c · espera Entendi"
- tapOn:
    text: "Entendi"
    label: "05.03 · toca em Entendi"
# O primeiro da fila recebe o push "É quase a sua vez!" logo ao entrar; com o
# app aberto ele vira uma caixa com "OK" que cobre a tela (o queue-position some
# da arvore). Na entrada nao ha mais o aviso de tres botoes (André, 22/10):
# so a faixa da tolerancia. Fecha o push, se veio.
# O push pode chegar depois: espera um pouco por ele e fecha.
- extendedWaitUntil:
    visible: "É quase a sua vez!"
    timeout: ${8000 * LENTO}
    optional: true
    label: "05.08 · espera o push da vez, se ainda nao veio"
- runFlow:
    when:
      visible: "É quase a sua vez!"
    commands:
      - tapOn:
          id: "dialogo-botao-0"
    label: "05.09 · fecha o push da vez"
- extendedWaitUntil:
    visible:
      id: "queue-position"
    timeout: ${30000 * LENTO}
    label: "05.10 · espera queue-position"

# A etapa e de SAIR COM MULTA (Andre, 04/10): dentro da tolerancia ("Voce pode
# sair da fila sem custo ate HH:MM") a saida e de graca. Espera a faixa sumir —
# o horario dela e o do servidor — e so entao sai.
# Em laço, conferindo de novo depois de 5 s: a faixa pode sumir por um
# instante num re-render, e um notVisible so passava cedo (bateria 09/10
# 20:30, 06: passou em 33 s com "sem custo até 20:50" na tela, e a saida foi de
# graca, sem a caixa "Sair da fila?").
# Voltas de 30 s, com o "Wait" do ANR entre elas: a tolerancia e tempo de
# relogio, e uma espera longa e continua derrubava o adb no emulador ("device
# offline" na 06, baterias 11/10 23:57 e 12/10 02:09). 40 voltas cobrem os
# 15 min da tolerancia com folga.
- repeat:
    times: 40
    while:
      visible:
        text: ".*sem custo até.*"
    commands:
      - extendedWaitUntil:
          notVisible:
            text: ".*sem custo até.*"
          timeout: 30000
          optional: true
      - runFlow:
          file: ../apoio/esperar_o_sistema.yaml
      # A pausa de 5 s antes de conferir de novo: espera a faixa voltar.
      - extendedWaitUntil:
          visible:
            text: ".*sem custo até.*"
          timeout: ${5000 * LENTO}
          optional: true
    label: "05.11 · espera a tolerância acabar (a faixa sem custo some)"
# Uma caixa por cima (o push da vez com o app aberto) tambem esconde a faixa:
# fecha e confere de novo, com a tela livre.
- runFlow:
    when:
      visible: "É quase a sua vez!"
    commands:
      - tapOn:
          id: "dialogo-botao-0"
    label: "05.1A · fecha o push da vez, se cobriu a faixa"
- extendedWaitUntil:
    visible:
      id: "leave-queue"
    timeout: ${10000 * LENTO}
    label: "05.1B · a tela da fila está livre"
- repeat:
    times: 30
    while:
      visible:
        text: ".*sem custo até.*"
    commands:
      - extendedWaitUntil:
          notVisible:
            text: ".*sem custo até.*"
          timeout: 30000
          optional: true
      - runFlow:
          file: ../apoio/esperar_o_sistema.yaml
    label: "05.1C · a faixa sem custo saiu de vez (voltas de 30 s)"
- assertNotVisible:
    text: ".*sem custo até.*"
    label: "05.1D · confere que a faixa saiu"

# sair-da-fila-texto (15/10): um toque so mostra a faixa de uma linha, com o
# valor e o "Saiba mais" (o toque no link abre o navegador, fora do app — so
# confere que esta la). Os asserts levam mais que a janela de 1,5 s: o toque
# duplo abaixo comeca do zero.
- tapOn:
    id: "leave-queue"
    label: "05.1E · um toque em leave-queue"
- assertVisible:
    text: "Se sair, você paga uma multa de R\\$.*"
    label: "05.1F · a faixa diz a multa em uma linha"
- assertVisible:
    id: "saida-saiba-mais"
    label: "05.1G · o Saiba mais está na faixa"

# Sair da fila: dois toques seguidos (D15) e a confirmacao com o valor. Dois
# tapOn saem ~2 s um do outro, fora da janela de 1,5 s (JANELA_DO_TOQUE_DUPLO_MS):
# cada um so mostrava a faixa e a confirmacao nunca abria. O doubleTapOn toca
# duas vezes dentro da janela.
- doubleTapOn:
    id: "leave-queue"
    label: "05.12 · toque duplo em leave-queue"
# O "?" escapado: o texto e um regex, e "Sair da fila?" casava com o proprio
# botao "Sair da fila" (o ? deixava o "a" opcional) — passava sem a caixa.
- extendedWaitUntil:
    visible: "Sair da fila\\?"
    timeout: ${10000 * LENTO}
    label: "05.13 · espera Sair da fila?"
- assertVisible:
    text: "Permanecer na fila"
    label: "05.13b · a caixa oferece Permanecer na fila"
- assertNotVisible:
    text: "Adiar minha vez"
    label: "05.13c · sem o botao Adiar minha vez"
# A caixa so tem dois botoes (entrada-e-saida-da-fila, 22/10): "Permanecer na
# fila" e "Sim, sair". Pelo id do destrutivo.
- tapOn:
    id: "dialogo-botao-destrutivo"
    label: "05.14 · toca em Sim, sair"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "05.15 · roda fechar_aviso"
