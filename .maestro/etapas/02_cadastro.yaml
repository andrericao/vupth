# Cadastro a partir do convite do Perfil, com o nome na tela seguinte.
# env: EMAIL_CLIENTE, NOME_CLIENTE
appId: ${APP_ID}
---
- tapOn:
    text: "Criar conta grátis"
    label: "02.01 · toca em Criar conta grátis"
- tapOn:
    text: "E-mail"
    label: "02.02 · toca em E-mail"
- inputText:
    text: ${EMAIL_CLIENTE}
    label: "02.03 · digita ${EMAIL_CLIENTE}"
- tapOn:
    text: "Crie uma senha"
    label: "02.04 · toca em Crie uma senha"
- inputText:
    text: ${SENHA}
    label: "02.05 · digita ${SENHA}"
- tapOn:
    text: "Confirmar senha"
    label: "02.06 · toca em Confirmar senha"
- inputText:
    text: ${SENHA}
    label: "02.07 · digita ${SENHA}"
- hideKeyboard:
    label: "02.08 · fecha o teclado"
- tapOn:
    id: "primary-signup"
    label: "02.09 · toca em primary-signup"

# A caixa da notificacao vem logo depois do cadastro, durante esta espera
# (bateria-ainda-pede-mao, 03/10): a espera nega a caixa enquanto espera.
- runFlow:
    file: ../apoio/esperar_negando.yaml
    env:
      ALVO: "complete-profile-name"
    label: "02.10 · espera complete-profile-name (negando a caixa do sistema)"
- tapOn:
    id: "complete-profile-name"
    label: "02.11 · toca em complete-profile-name"
- inputText:
    text: ${NOME_CLIENTE}
    label: "02.12 · digita ${NOME_CLIENTE}"
- hideKeyboard:
    label: "02.13 · fecha o teclado"
- tapOn:
    id: "complete-profile-save"
    label: "02.14 · toca em complete-profile-save"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "02.15 · roda fechar_aviso"

# Logado, o Perfil mostra a conta — e a Aparencia volta.
- tapOn:
    text: "Perfil"
    label: "02.16 · toca em Perfil"
- extendedWaitUntil:
    visible: "CONTA"
    timeout: ${15000 * LENTO}
    label: "02.17 · espera CONTA"
- assertVisible:
    text: "APARÊNCIA"
    label: "02.18 · vê APARÊNCIA"
- assertNotVisible:
    text: "Criar conta grátis"
    label: "02.19 · não vê Criar conta grátis"
