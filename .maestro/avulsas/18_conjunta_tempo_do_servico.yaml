# Etapa avulsa 18 (bateria-conjunta): Client e Partner no mesmo celular. Precisa
# do APK do Partner instalado e do vupth-partner clonado ao lado do vupth.
appId: ${APP_ID}
env:
  APP_ID: com.vupth.client.preview
  API: https://vupth-backend-ia.onrender.com
  SENHA: "Teste@123"
---
- runFlow:
    file: ../apoio/preparo.yaml
    env:
      ETAPA: "18"
      LOJA: "1"
      CONTA: "1"
      ABERTURA: "1"
      FILA_FECHADA: "0"
    label: "18.P0 · prepara a etapa"
- runFlow:
    file: ../apoio/abrir_a_loja.yaml
    env:
      TAG: ${output.TAG}
      LOJA: ${output.LOJA}
      PROF: ${output.PROF}
      PROF_ID: ${output.PROF_ID}
      SERVICO_ID: ${output.SERVICO_ID}
      EMAIL_PROF: ${output.EMAIL_PROF}
    label: "18.L1 · abre a loja de teste"
- runFlow:
    file: ../apoio/escolher_servico.yaml
    env:
      TAG: ${output.TAG}
      LOJA: ${output.LOJA}
      PROF: ${output.PROF}
      PROF_ID: ${output.PROF_ID}
      SERVICO_ID: ${output.SERVICO_ID}
      EMAIL_PROF: ${output.EMAIL_PROF}
    label: "18.L2 · escolhe o serviço"
- runFlow:
    file: ../etapas/18_conjunta_tempo_do_servico.yaml
    env:
      TAG: ${output.TAG}
      LOJA: ${output.LOJA}
      PROF: ${output.PROF}
      PROF_ID: ${output.PROF_ID}
      SERVICO_ID: ${output.SERVICO_ID}
      EMAIL_PROF: ${output.EMAIL_PROF}
    label: "18.E1 · roda 18_conjunta_tempo_do_servico"
