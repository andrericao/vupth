# Etapa avulsa 04 (bateria-nao-para): roda num maestro test proprio.
# 04 comeca na tela da loja.
appId: ${APP_ID}
env:
  APP_ID: com.vupth.client.preview
  API: https://vupth-backend-ia.onrender.com
  SENHA: "Teste@123"
---
- runFlow:
    file: ../apoio/preparo.yaml
    env:
      ETAPA: "04"
      LOJA: "1"
      CONTA: "1"
      ABERTURA: "1"
      FILA_FECHADA: "0"
    label: "04.P0 · prepara a etapa"
- runFlow:
    file: ../apoio/abrir_a_loja.yaml
    env:
      TAG: ${output.TAG}
      LOJA: ${output.LOJA}
      PROF: ${output.PROF}
      PROF_ID: ${output.PROF_ID}
      SERVICO_ID: ${output.SERVICO_ID}
      EMAIL_PROF: ${output.EMAIL_PROF}
    label: "04.L1 · abre a loja de teste"
- runFlow:
    file: ../etapas/04_fim_de_fila_hibrido.yaml
    env:
      TAG: ${output.TAG}
      LOJA: ${output.LOJA}
      PROF: ${output.PROF}
      PROF_ID: ${output.PROF_ID}
      SERVICO_ID: ${output.SERVICO_ID}
      EMAIL_PROF: ${output.EMAIL_PROF}
    label: "04.E1 · roda 04_fim_de_fila_hibrido"
