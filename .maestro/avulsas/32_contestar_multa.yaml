    env:
      ETAPA: "32"
      LOJA: "0"
      CONTA: "1"
      ABERTURA: "1"
      FILA_FECHADA: "0"
    label: "32.P0 · prepara a etapa"
- runFlow:
    file: ../etapas/32_contestar_multa.yaml
    env:
      API: ${API}
      SENHA: ${SENHA}
      EMAIL_CLIENTE: ${output.EMAIL_CLIENTE}
    label: "32.E1 · roda 32_contestar_multa"
