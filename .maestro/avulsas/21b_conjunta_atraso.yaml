# Etapa avulsa 21b (etapas-curtas, 15/10: a espera e o atraso; a 21a abre a
# fila pelo card) (bateria-conjunta): Client e Partner no mesmo celular. Precisa
# do APK do Partner instalado e do vupth-partner clonado ao lado do vupth.
appId: ${APP_ID}
env:
  APP_ID: com.vupth.client.preview
  API: https://vupth-backend-ia.onrender.com
  SENHA: "Teste@123"
---
- runFlow:
    file: ../apoio/preparo.yaml
    env:
      ETAPA: "21"
      # Contas proprias da 21b: a 21a roda na mesma rodada com o mesmo ETAPA.
      TAG: "${(typeof TAG !== 'undefined' && TAG ? String(TAG) : String(Date.now()).slice(-6)) + '2'}"
      LOJA: "1"
      CONTA: "1"
      ABERTURA: "1"
      FILA_FECHADA: "0"
    label: "21.P0 · prepara a etapa"
- runScript:
    file: ../scripts/fila_pela_api.js
    env:
      ACAO: "entrar"
      EMAIL_CLIENTE: ${output.EMAIL_CLIENTE}
      PROF_ID: ${output.PROF_ID}
      LOJA_ID: ${output.LOJA_ID}
      SERVICO_ID: ${output.SERVICO_ID}
    label: "21.PD · entra na fila pela API"
# A espera de 5 min e meio e com o app FECHADO: a 21b reabre o Client so
# depois que o Partner marca o atraso.
- stopApp:
    label: "21.PE · fecha o app (a espera e com ele fechado)"
- runFlow:
    file: ../etapas/21b_conjunta_atraso.yaml
    env:
      TAG: ${output.TAG}
      LOJA: ${output.LOJA}
      PROF: ${output.PROF}
      PROF_ID: ${output.PROF_ID}
      SERVICO_ID: ${output.SERVICO_ID}
      EMAIL_PROF: ${output.EMAIL_PROF}
      NOME_CLIENTE: ${output.NOME_CLIENTE}
    label: "21.E1 · roda 21b_conjunta_atraso"
