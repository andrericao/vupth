# Etapa avulsa 28 (teste-do-essencial, DEC-157): logar, marcar um servico e pagar. Roda PRIMEIRO na bateria;
# se falhar, a bateria para. Conjunta: usa o Partner para finalizar (precisa do APK e do ../vupth-partner).
appId: ${APP_ID}
env:
  APP_ID: com.vupth.client.preview
  API: https://vupth-backend-ia.onrender.com
  SENHA: "Teste@123"
---
- runFlow:
    file: ../apoio/preparo.yaml
    env:
      ETAPA: "28"
      LOJA: "1"
      CONTA: "1"
      ABERTURA: "1"
      FILA_FECHADA: "0"
    label: "28.P0 · prepara a etapa"
- runFlow:
    file: ../etapas/09_login.yaml
    env:
      EMAIL_CLIENTE: ${output.EMAIL_CLIENTE}
    label: "28.L0 · logar: sai da conta e entra de novo com e-mail e senha"
- runFlow:
    file: ../apoio/abrir_a_loja.yaml
    env:
      TAG: ${output.TAG}
      LOJA: ${output.LOJA}
      PROF: ${output.PROF}
      PROF_ID: ${output.PROF_ID}
      SERVICO_ID: ${output.SERVICO_ID}
      EMAIL_PROF: ${output.EMAIL_PROF}
    label: "28.L1 · abre a loja de teste"
- runFlow:
    file: ../apoio/escolher_servico.yaml
    env:
      TAG: ${output.TAG}
      LOJA: ${output.LOJA}
      PROF: ${output.PROF}
      PROF_ID: ${output.PROF_ID}
      SERVICO_ID: ${output.SERVICO_ID}
      EMAIL_PROF: ${output.EMAIL_PROF}
    label: "28.L2 · escolhe o serviço"
- runFlow:
    file: ../etapas/28_essencial.yaml
    env:
      EMAIL_PROF: ${output.EMAIL_PROF}
      NOME_CLIENTE: ${output.NOME_CLIENTE}
    label: "28.E1 · roda 28_essencial"
