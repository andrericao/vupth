# Etapa avulsa 13 (push-na-bateria, Andre 05/10): o push "É quase a sua vez!"
# chega na gaveta do Android e o toque abre a fila (push-abre-a-fila); depois,
# o botao OK da notificacao so a tira, sem abrir o app (notificacao-de-ciencia).
# O primeiro da fila recebe o push ao entrar; a entrada vem pela API com o app
# fechado ou em segundo plano. Notificacoes PERMITIDAS so nesta etapa.
appId: ${APP_ID}
env:
  APP_ID: com.vupth.client.preview
  API: https://vupth-backend-ia.onrender.com
  SENHA: "Teste@123"
# Roda mesmo se a etapa falhar: a gaveta aberta (13.03/13.0A) nao pode ficar
# puxada por cima da etapa seguinte (cortina de notificacoes, Andre 09/10).
onFlowComplete:
  - runFlow:
      file: ../apoio/fechar_cortina.yaml
---
- runFlow:
    file: ../apoio/preparo.yaml
    env:
      ETAPA: "13"
      LOJA: "1"
      CONTA: "1"
      ABERTURA: "1"
      FILA_FECHADA: "0"
      NOTIFICACOES: "unset"
    label: "13.P0 · prepara a etapa"

# A permissao vem pelo caminho do app (bateria 10/10 08:06, 13.T3: o "allow"
# do launchApp nao valia no aparelho e o app, que so pede depois da tela 10,
# ficava sem token). Entra na fila pelo app, a tela 10 vem, "Quero ser avisada"
# e permitir na caixa do sistema; depois sai pela API, na tolerancia.
- runFlow:
    file: ../apoio/abrir_a_loja.yaml
    env:
      TAG: ${output.TAG}
      LOJA: ${output.LOJA}
      PROF: ${output.PROF}
      PROF_ID: ${output.PROF_ID}
      SERVICO_ID: ${output.SERVICO_ID}
      EMAIL_PROF: ${output.EMAIL_PROF}
    label: "13.A1 · abre a loja de teste"
- runFlow:
    file: ../apoio/escolher_servico.yaml
    env:
      TAG: ${output.TAG}
      LOJA: ${output.LOJA}
      PROF: ${output.PROF}
      PROF_ID: ${output.PROF_ID}
      SERVICO_ID: ${output.SERVICO_ID}
      EMAIL_PROF: ${output.EMAIL_PROF}
    label: "13.A2 · escolhe o serviço"
- tapOn:
    id: "primary-queue"
    label: "13.A3 · toca em primary-queue"
- extendedWaitUntil:
    visible: "Entendi"
    timeout: 60000
    label: "13.A4 · espera Entendi"
- tapOn:
    text: "Entendi"
    label: "13.A5 · toca em Entendi"
- repeat:
    times: 3
    while:
      visible: "(Sua vez está chegando|É quase a sua vez!)"
    commands:
      - tapOn:
          id: "dialogo-botao-0"
      - waitForAnimationToEnd:
          timeout: 3000
    label: "13.A6 · fecha a política da multa e o push da vez, se cobrem a tela 10"
- extendedWaitUntil:
    visible:
      id: "push-accept"
    timeout: 30000
    label: "13.A7 · espera a tela 10"
- tapOn:
    id: "push-accept"
    label: "13.A8 · toca em Quero ser avisada"
- extendedWaitUntil:
    visible:
      id: "com.android.permissioncontroller:id/permission_allow_button"
    timeout: 30000
    label: "13.A9 · a caixa do sistema aparece"
- tapOn:
    id: "com.android.permissioncontroller:id/permission_allow_button"
    label: "13.AA · permite"
- runScript:
    file: ../scripts/fila_pela_api.js
    env:
      ACAO: "sair-da-ativa"
      EMAIL_CLIENTE: ${output.EMAIL_CLIENTE}
    label: "13.AB · sai da fila pela API"
- tapOn:
    text: "Perfil"
    label: "13.AC · toca em Perfil"
# O preparo (PB) termina na tela Sistema, e o toque em Perfil volta a ela
# (bateria 10/10 15:32, 13.AD): so rola e abre se ainda estiver no Perfil.
- runFlow:
    when:
      notVisible:
        id: "version-line"
    commands:
      - scrollUntilVisible:
          element:
            text: "Versão do app"
      - tapOn:
          text: "Versão do app"
    label: "13.AD · abre a tela Sistema, se ainda não estiver nela"

# Na tela Sistema. Antes de fechar o app, o
# backend precisa ter o token (POST /devices, com retentativas de ate ~66s no
# cold start): fechar antes matava o registro e o push nunca chegava (13.04
# vermelha em todas as rodadas ate 09/10). Os 7 toques na versao abrem o painel.
- repeat:
    times: 7
    commands:
      - tapOn:
          id: "version-line"
    label: "13.T1 · abre o diagnóstico de push (7 toques na versão)"
- scrollUntilVisible:
    element:
      text: "backend sabe\\?"
    label: "13.T2 · rola até o painel de push"
- extendedWaitUntil:
    visible: "sim \\(POST /devices\\)"
    timeout: 90000
    label: "13.T3 · o backend tem o token de push (POST /devices)"

# 1) App FECHADO: entra pela API, o push chega, o toque abre a fila.
- stopApp:
    label: "13.01 · fecha o app"
- runScript:
    file: ../scripts/fila_pela_api.js
    env:
      ACAO: "entrar"
      EMAIL_CLIENTE: ${output.EMAIL_CLIENTE}
      PROF_ID: ${output.PROF_ID}
      LOJA_ID: ${output.LOJA_ID}
      SERVICO_ID: ${output.SERVICO_ID}
    label: "13.02 · entra na fila pela API"
- swipe:
    start: "50%, 0%"
    end: "50%, 80%"
    label: "13.03 · abre a gaveta de notificações"
- extendedWaitUntil:
    visible: "É quase a sua vez!"
    timeout: 90000
    label: "13.04 · espera o push É quase a sua vez!"
- tapOn:
    text: "É quase a sua vez!"
    label: "13.05 · toca no corpo do push"
# Com a fila no aparelho abre a tela dela; app recem-aberto, Atendimentos com o
# cartao da fila (push-abre-a-fila). Nunca o Inicio.
- extendedWaitUntil:
    visible:
      id: "(queue-position|card-da-fila)"
    timeout: 60000
    label: "13.06 · abriu a fila ou o cartão da fila"
- runFlow:
    file: ../apoio/fechar_aviso.yaml
    label: "13.07 · fecha as caixas"

# 2) App em SEGUNDO PLANO: sai e entra de novo pela API; o OK so tira a notificacao.
- runScript:
    file: ../scripts/fila_pela_api.js
    env:
      ACAO: "sair"
      EMAIL_CLIENTE: ${output.EMAIL_CLIENTE}
      ATENDIMENTO_ID: ${output.ATENDIMENTO_ID}
    label: "13.08 · sai da fila pela API (na tolerância)"
- pressKey: Home
- runScript:
    file: ../scripts/fila_pela_api.js
    env:
      ACAO: "entrar"
      EMAIL_CLIENTE: ${output.EMAIL_CLIENTE}
      PROF_ID: ${output.PROF_ID}
      LOJA_ID: ${output.LOJA_ID}
      SERVICO_ID: ${output.SERVICO_ID}
    label: "13.09 · entra de novo pela API, com o app em segundo plano"
- swipe:
    start: "50%, 0%"
    end: "50%, 80%"
    label: "13.0A · abre a gaveta de notificações"
- extendedWaitUntil:
    visible: "É quase a sua vez!"
    timeout: 90000
    label: "13.0B · espera o push de novo"
# O botao de acao da notificacao (categoryId CIENCIA): "OK".
- tapOn:
    text: "OK"
    label: "13.0C · toca no OK da notificação"
- extendedWaitUntil:
    notVisible: "É quase a sua vez!"
    timeout: 10000
    label: "13.0D · a notificação sumiu"
- assertNotVisible:
    id: "queue-position"
    label: "13.0E · o OK não abriu o app"
- pressKey: Back
