# Etapa avulsa 21 (bateria-conjunta): Client e Partner no mesmo celular. Precisa
# do APK do Partner instalado e do vupth-partner clonado ao lado do vupth.
appId: ${APP_ID}
env:
  APP_ID: com.vupth.client.preview
  API: https://vupth-backend-ia.onrender.com
  SENHA: "Teste@123"
---
- runFlow:
    file: ../apoio/preparo.yaml
    env:
      ETAPA: "21"
      LOJA: "1"
      CONTA: "1"
      ABERTURA: "1"
      FILA_FECHADA: "0"
    label: "21.P0 · prepara a etapa"
- runScript:
    file: ../scripts/fila_pela_api.js
    env:
      ACAO: "entrar"
      EMAIL_CLIENTE: ${output.EMAIL_CLIENTE}
      PROF_ID: ${output.PROF_ID}
      LOJA_ID: ${output.LOJA_ID}
      SERVICO_ID: ${output.SERVICO_ID}
    label: "21.PD · entra na fila pela API"
- runFlow:
    file: ../etapas/21_conjunta_atraso.yaml
    env:
      TAG: ${output.TAG}
      LOJA: ${output.LOJA}
      PROF: ${output.PROF}
      PROF_ID: ${output.PROF_ID}
      SERVICO_ID: ${output.SERVICO_ID}
      EMAIL_PROF: ${output.EMAIL_PROF}
      NOME_CLIENTE: ${output.NOME_CLIENTE}
    label: "21.E1 · roda 21_conjunta_atraso"
