# ════════════════════════════════════════════════════════════════════════════
# BATERIA COMPLETA do client — Maestro, no APK de PREVIEW, contra o STAGING
# (Render). Mesmo formato da bateria do vupth-partner.
#
#   bash .maestro/setup.sh                      # celular, teclado e servidor
#   (o setup.sh imprime o comando do maestro test, com as variaveis)
#
# Cada rodada cria contas e uma loja NOVAS (sufixo = hora da rodada), entao
# pode repetir a vontade. A loja nao vem do app do Partner: e montada pela API
# do staging (scripts/loja_aberta.js) — dono e profissional na mesma conta,
# trabalhando, com um servico.
#
# As etapas dependem umas das outras (o cadastro da 02 e quem entra na fila na
# 05; a multa da 05 e a que a 06 confere), por isso e UM roteiro que chama as
# doze em ordem.
# ════════════════════════════════════════════════════════════════════════════
appId: ${APP_ID}
env:
  APP_ID: com.vupth.client.preview
  API: https://vupth-backend-ia.onrender.com
  SENHA: "Teste@123"
---
- evalScript:
    script: ${output.TAG = String(Date.now()).slice(-6)}
    label: "00.01 · calcula TAG"
- evalScript:
    script: ${output.EMAIL_CLIENTE = 'client_c' + output.TAG + '@teste.com'}
    label: "00.02 · calcula EMAIL_CLIENTE"
- evalScript:
    script: ${output.NOME_CLIENTE = 'Cliente' + output.TAG}
    label: "00.03 · calcula NOME_CLIENTE"

# A loja ANTES de abrir o app: a lista do Inicio ja chega com ela.
- runScript:
    file: scripts/loja_aberta.js
    env:
      API: ${API}
      SENHA: ${SENHA}
      TAG: ${output.TAG}
    label: "00.04 · roda loja_aberta"

# Sem permissao de localizacao nem de notificacao: a caixa do sistema nao
# aparece no meio do roteiro, e a lista vem sem raio (ninguem some dela).
# O app abre na tela "preparando servidor" ate o staging responder.
- launchApp:
    clearState: true
    permissions:
      location: deny
      notifications: deny
    label: "00.05 · abre o app"
- extendedWaitUntil:
    visible:
      id: "onboarding-start"
    timeout: 120000
    label: "00.06 · espera onboarding-start"
# A caixa de localizacao do sistema vem por cima da abertura, mesmo com o
# `permissions: deny` (Android 13+) — nega aqui, antes do primeiro toque, para
# ninguem precisar tocar no aparelho (bateria-sozinha).
- runFlow:
    file: apoio/fechar_aviso.yaml
    label: "00.07 · nega a caixa do sistema, se vier"

- runFlow:
    file: etapas/01_visitante.yaml
    label: "00.08 · roda 01_visitante"
- runFlow:
    file: etapas/02_cadastro.yaml
    env:
      EMAIL_CLIENTE: ${output.EMAIL_CLIENTE}
      NOME_CLIENTE: ${output.NOME_CLIENTE}
    label: "00.09 · roda 02_cadastro"
- runFlow:
    file: etapas/03_loja.yaml
    env:
      TAG: ${output.TAG}
      LOJA: ${output.LOJA}
      PROF: ${output.PROF}
      PROF_ID: ${output.PROF_ID}
    label: "00.10 · roda 03_loja"
- runFlow:
    file: etapas/04_fim_de_fila_hibrido.yaml
    env:
      PROF_ID: ${output.PROF_ID}
      SERVICO_ID: ${output.SERVICO_ID}
    label: "00.11 · roda 04_fim_de_fila_hibrido"
- runFlow:
    file: etapas/05_entra_e_sai_com_multa.yaml
    label: "00.12 · roda 05_entra_e_sai_com_multa"
- runFlow:
    file: etapas/06_multa_no_total.yaml
    env:
      TAG: ${output.TAG}
      LOJA: ${output.LOJA}
      PROF_ID: ${output.PROF_ID}
      SERVICO_ID: ${output.SERVICO_ID}
    label: "00.13 · roda 06_multa_no_total"
- runFlow:
    file: etapas/07_agendar_pela_barra.yaml
    env:
      PROF: ${output.PROF}
    label: "00.14 · roda 07_agendar_pela_barra"
- runFlow:
    file: etapas/08_fila_fechada.yaml
    env:
      TAG: ${output.TAG}
      LOJA: ${output.LOJA}
      PROF_ID: ${output.PROF_ID}
      SERVICO_ID: ${output.SERVICO_ID}
      EMAIL_PROF: ${output.EMAIL_PROF}
    label: "00.15 · roda 08_fila_fechada"
- runFlow:
    file: etapas/09_login.yaml
    env:
      EMAIL_CLIENTE: ${output.EMAIL_CLIENTE}
    label: "00.16 · roda 09_login"
- runFlow:
    file: etapas/10_pedido_de_corte.yaml
    env:
      TAG: ${output.TAG}
      LOJA: ${output.LOJA}
      PROF_ID: ${output.PROF_ID}
      SERVICO_ID: ${output.SERVICO_ID}
      EMAIL_PROF: ${output.EMAIL_PROF}
    label: "00.17 · roda 10_pedido_de_corte"
- runFlow:
    file: etapas/11_reabrir_o_app.yaml
    label: "00.18 · roda 11_reabrir_o_app"
- runFlow:
    file: etapas/12_aparencia.yaml
    label: "00.19 · roda 12_aparencia"
