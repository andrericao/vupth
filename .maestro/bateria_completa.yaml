# ════════════════════════════════════════════════════════════════════════════
# BATERIA COMPLETA do client — Maestro, no APK de PREVIEW, contra o STAGING
# (Render). Mesmo formato da bateria do vupth-partner.
#
#   bash .maestro/setup.sh                      # celular, teclado e servidor
#   (o setup.sh imprime o comando do maestro test, com as variaveis)
#
# Cada rodada cria contas e uma loja NOVAS (sufixo = hora da rodada), entao
# pode repetir a vontade. A loja nao vem do app do Partner: e montada pela API
# do staging (scripts/loja_aberta.js) — dono e profissional na mesma conta,
# trabalhando, com um servico.
#
# As etapas dependem umas das outras (o cadastro da 02 e quem entra na fila na
# 05; a multa da 05 e a que a 06 confere), por isso e UM roteiro que chama as
# oito em ordem.
# ════════════════════════════════════════════════════════════════════════════
appId: ${APP_ID}
env:
  APP_ID: com.vupth.client.preview
  API: https://vupth-backend-ia.onrender.com
  SENHA: "Teste@123"
---
- evalScript: ${output.TAG = String(Date.now()).slice(-6)}
- evalScript: ${output.EMAIL_CLIENTE = 'client_c' + output.TAG + '@teste.com'}
- evalScript: ${output.NOME_CLIENTE = 'Cliente' + output.TAG}

# A loja ANTES de abrir o app: a lista do Inicio ja chega com ela.
- runScript:
    file: scripts/loja_aberta.js
    env:
      API: ${API}
      SENHA: ${SENHA}
      TAG: ${output.TAG}

# Sem permissao de localizacao nem de notificacao: a caixa do sistema nao
# aparece no meio do roteiro, e a lista vem sem raio (ninguem some dela).
# O app abre na tela "preparando servidor" ate o staging responder.
- launchApp:
    clearState: true
    permissions:
      location: deny
      notifications: deny
- extendedWaitUntil:
    visible:
      id: "onboarding-start"
    timeout: 120000

- runFlow:
    file: etapas/01_visitante.yaml
- runFlow:
    file: etapas/02_cadastro.yaml
    env:
      EMAIL_CLIENTE: ${output.EMAIL_CLIENTE}
      NOME_CLIENTE: ${output.NOME_CLIENTE}
- runFlow:
    file: etapas/03_loja.yaml
    env:
      TAG: ${output.TAG}
      LOJA: ${output.LOJA}
      PROF: ${output.PROF}
      PROF_ID: ${output.PROF_ID}
- runFlow:
    file: etapas/04_fim_de_fila_hibrido.yaml
    env:
      PROF_ID: ${output.PROF_ID}
      SERVICO_ID: ${output.SERVICO_ID}
- runFlow: etapas/05_entra_e_sai_com_multa.yaml
- runFlow:
    file: etapas/06_multa_no_total.yaml
    env:
      TAG: ${output.TAG}
      LOJA: ${output.LOJA}
      PROF_ID: ${output.PROF_ID}
      SERVICO_ID: ${output.SERVICO_ID}
- runFlow:
    file: etapas/07_agendar_pela_barra.yaml
    env:
      PROF: ${output.PROF}
- runFlow:
    file: etapas/08_fila_fechada.yaml
    env:
      TAG: ${output.TAG}
      LOJA: ${output.LOJA}
      PROF_ID: ${output.PROF_ID}
      EMAIL_PROF: ${output.EMAIL_PROF}
