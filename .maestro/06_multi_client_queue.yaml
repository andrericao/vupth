appId: host.exp.exponent
name: Multi-client - 3 clientes na fila + cancelamento
---
- evalScript: ${output.suffix = Date.now().toString().slice(-5)}

- assertVisible: "Estabelecimentos"

# Logout se logado
- runFlow:
    when:
      visible:
        id: "profile-icon"
    commands:
      - tapOn:
          id: "profile-icon"
      - tapOn: "Sair da conta"
      - extendedWaitUntil:
          visible: "Cadastrar"
          timeout: ${5000 * LENTO}

# === CLIENTE 1 ===
- tapOn: "Cadastrar"
- assertVisible: "Criar Conta"
- tapOn:
    text: "E-mail"
- inputText: "cli1_${output.suffix}@teste.com"
- tapOn:
    text: "Senha"
    index: 0
- inputText: "Teste@123"
- tapOn:
    text: "Confirmar senha"
- inputText: "Teste@123"
- hideKeyboard
- scrollUntilVisible:
    element: "Cadastrar"
    direction: DOWN
- tapOn: "Cadastrar"
- extendedWaitUntil:
    visible: "Estabelecimentos"
    timeout: ${60000 * LENTO}

# Buscar e entrar — NÃO limpar busca antes de clicar
- tapOn:
    text: "Buscar estabelecimento..."
- eraseText: 30
- inputText: "Corte Real"
- hideKeyboard
- extendedWaitUntil:
    visible: "Corte Real 97616"
    timeout: ${30000 * LENTO}
- tapOn: "Corte Real 97616"
- extendedWaitUntil:
    visible: "Entrar na fila (menor espera)"
    timeout: ${30000 * LENTO}
- tapOn: "Entrar na fila (menor espera)"
- extendedWaitUntil:
    visible: "Você está na fila!"
    timeout: ${60000 * LENTO}
- assertVisible: "Tempo estimado"
- tapOn: "Voltar ao início"
- assertVisible: "Estabelecimentos"
- assertVisible:
    text: "Em fila.*"

# Logout cliente 1
- tapOn:
    id: "profile-icon"
- tapOn: "Sair da conta"
- extendedWaitUntil:
    visible: "Cadastrar"
    timeout: ${5000 * LENTO}

# === CLIENTE 2 ===
- tapOn: "Cadastrar"
- tapOn:
    text: "E-mail"
- inputText: "cli2_${output.suffix}@teste.com"
- tapOn:
    text: "Senha"
    index: 0
- inputText: "Teste@123"
- tapOn:
    text: "Confirmar senha"
- inputText: "Teste@123"
- hideKeyboard
- scrollUntilVisible:
    element: "Cadastrar"
    direction: DOWN
- tapOn: "Cadastrar"
- extendedWaitUntil:
    visible: "Estabelecimentos"
    timeout: ${60000 * LENTO}

- tapOn:
    text: "Buscar estabelecimento..."
- eraseText: 30
- inputText: "Corte Real"
- hideKeyboard
- extendedWaitUntil:
    visible: "Corte Real 97616"
    timeout: ${30000 * LENTO}
- tapOn: "Corte Real 97616"
- extendedWaitUntil:
    visible: "Entrar na fila (menor espera)"
    timeout: ${30000 * LENTO}
- tapOn: "Entrar na fila (menor espera)"
- extendedWaitUntil:
    visible: "Você está na fila!"
    timeout: ${60000 * LENTO}
- tapOn: "Voltar ao início"

# Logout cliente 2
- tapOn:
    id: "profile-icon"
- tapOn: "Sair da conta"
- extendedWaitUntil:
    visible: "Cadastrar"
    timeout: ${5000 * LENTO}

# === CLIENTE 3 — entra e CANCELA ===
- tapOn: "Cadastrar"
- tapOn:
    text: "E-mail"
- inputText: "cli3_${output.suffix}@teste.com"
- tapOn:
    text: "Senha"
    index: 0
- inputText: "Teste@123"
- tapOn:
    text: "Confirmar senha"
- inputText: "Teste@123"
- hideKeyboard
- scrollUntilVisible:
    element: "Cadastrar"
    direction: DOWN
- tapOn: "Cadastrar"
- extendedWaitUntil:
    visible: "Estabelecimentos"
    timeout: ${60000 * LENTO}

- tapOn:
    text: "Buscar estabelecimento..."
- eraseText: 30
- inputText: "Corte Real"
- hideKeyboard
- extendedWaitUntil:
    visible: "Corte Real 97616"
    timeout: ${30000 * LENTO}
- tapOn: "Corte Real 97616"
- extendedWaitUntil:
    visible: "Entrar na fila (menor espera)"
    timeout: ${30000 * LENTO}
- tapOn: "Entrar na fila (menor espera)"
- extendedWaitUntil:
    visible: "Você está na fila!"
    timeout: ${60000 * LENTO}

# CANCELAMENTO
- tapOn: "Sair da fila"
- tapOn:
    id: "dialogo-botao-destrutivo"
- extendedWaitUntil:
    visible: "Estabelecimentos"
    timeout: ${5000 * LENTO}
