# PRs automaticos de atualizacao (melhoria de 02/10). Semanal, para nao virar
# ruido. Os PRs passam pelo mesmo CI (ci.yml) de qualquer outro.
#
# ⚠️ Expo, React Native e React sobem JUNTOS e com o Partner e o Backend (acordo
# entre equipes, SDK por aparelho no Expo Go) — por isso ficam de fora das
# atualizacoes de versao. Alerta de seguranca continua chegando para eles.
#
# ESLint so sobe de major junto com o eslint-config-expo: o eslint-plugin-react
# que ele traz quebra no ESLint 10 (context.getFilename removido) — PR #51.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: expo
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      # Acompanha a versao exata do react (o jest-expo confere): sobe com ele.
      # O PR #48 levou para 19.3.0 com o react em 19.1.0 e quebrou todas as suites.
      - dependency-name: react-test-renderer
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Majors presos ao Expo SDK (03/10, PRs #55, #56 e #58 vermelhos no CI):
      # sobem no upgrade do SDK, junto com o resto.
      # TypeScript 7: o verify do Expo quebra (TypeError 'Cjs').
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # RNTL 14: o render vira Promise — getByTestId some em dezenas de testes.
      - dependency-name: "@testing-library/react-native"
        update-types: ["version-update:semver-major"]
      # async-storage 3: o AppBoot e o queryPersist nao rodam. O "react-native-*"
      # de cima nao pega o nome com escopo.
      - dependency-name: "@react-native-async-storage/async-storage"
        update-types: ["version-update:semver-major"]
    groups:
      menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
