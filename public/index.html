<!DOCTYPE html>
<!--
  Modelo do index.html da web (pagina unica). O Expo le ESTE arquivo no lugar do
  dele e preenche o idioma (web.lang do app.json) e o titulo. Ele troca so a
  PRIMEIRA ocorrencia de cada marcador: nao cite os marcadores neste comentario.

  E o modelo padrao do Expo; a unica diferenca sao os links do icone do V da
  marca. Sem este arquivo so existe o favicon.ico que o Expo gera do
  web.favicon; com os links o navegador usa o SVG, nitido em qualquer tamanho,
  e os PNGs de 16, 32 e 512 e o do iPhone.
  Guardado por src/__tests__/projeto/marca.test.ts.
-->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- O V da marca. Arquivos em assets/marca/ (copiados para public/). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- O reset recomendado do react-native-web: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      Ative o JavaScript para usar o app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
